          default: false
          description: 'Includes the tool call results under key ''tool_call_result'' when set to `true`. Defaults to `false`.

            Example tool call result event:

            ```json

            {"query_id": "e2084408-48f8-4f52-9b59-43dd924705ef", "type": "tool_call_result", "tool_call_result": {"origin": {"tool_name": "example_tool", "arguments": {"arg1": "val1"}, "index": 0}, "result": "This is an example result.", "error": false}}

            ```'
          title: Include Tool Call Results
          type: boolean
        include_tool_calls:
          anyOf:
          - type: boolean
          - const: rendered
            type: string
          default: rendered
          description: 'Includes tool calls as tool call delta objects under key ''tool_call_delta'' when set to `true`. When set to `rendered`, tool call events are rendered as markdown text instead. This parameter only affects the stream (not the final result) and is only effective when the pipeline or deployed service makes tool calls (e.g. using the Agent component). Defaults to `rendered`.

