openapi: 3.2.0
info:
  description: deepset API description
  title: Haystack Enterprise Platform Deployments API
  version: 1.0.0
servers:
- description: deepset Europe
  url: https://api.cloud.deepset.ai
- description: deepset US
  url: https://api.us.deepset.ai
tags:
- name: Deployments
paths:
  /api/v1/workspaces/{workspace_name}/deployment-tags:
    get:
      description: 'List distinct tag strings attached to deployments in this workspace.


        Returns tag names currently in use, suitable for autocomplete when adding tags.

        Use the ``name`` query parameter for case-insensitive substring search.

        Use ``order`` to control alphabetical sort direction (default ascending).


        To filter the deployments list by tag, use ``GET .../deployments`` with repeated

        ``tags`` query parameters; matching is case-insensitive and uses OR semantics.'
      operationId: list_deployment_tags_api_v1_workspaces__workspace_name__deployment_tags_get
      parameters:
      - description: Type the name of the workspace.
        in: path
        name: workspace_name
        required: true
        schema:
          description: Type the name of the workspace.
          title: Workspace Name
          type: string
      - description: Case-insensitive substring filter on tag names. Use for autocomplete when selecting tags.
        in: query
        name: name
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Case-insensitive substring filter on tag names. Use for autocomplete when selecting tags.
          title: Name
      - description: Sort distinct tag names alphabetically in ascending or descending order.
        in: query
        name: order
        required: false
        schema:
          default: ASC
          description: Sort distinct tag names alphabetically in ascending or descending order.
          enum:
          - ASC
          - DESC
          title: Order
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  type: string
                title: Response List Deployment Tags Api V1 Workspaces  Workspace Name  Deployment Tags Get
                type: array
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - HTTPBearer: []
      summary: List Deployment Tags
      tags:
      - Deployments
      x-deepset-permissions:
        action: read
        asset: services
        asset_description: 'Access to services (deployments): create, update, publish and query.'
        type: workspace
  /api/v1/workspaces/{workspace_name}/deployments:
    get:
      description: 'List deployments in the workspace, sorted by ``updated_at`` descending by default.


        The runtime ``status`` of each deployment is reconciled from the operator before returning.

        ``total`` reflects any active filters.


        Pagination supports offset (``page_number`` and ``limit``) and keyset cursor

        (``before`` / ``after``) modes; use one at a time. Keyset cursor pagination

        (``before`` / ``after``) is not supported together with ``field=pipeline_name``

        and returns 422 if combined.


        You can filter results using OData syntax via the ``filter`` query parameter. Supported fields:

        - ``status``: Filter by persisted deployment status (``eq`` only), e.g.

        ``filter=status eq ''DEPLOYED''``

        - ``pipeline_name``: Filter by pipeline name from the active-revision lineage (``eq`` only), e.g.

        ``filter=pipeline_name eq ''my-pipeline''``

        - Combined filters: ``filter=status eq ''DEPLOYED'' and pipeline_name eq ''my-pipeline''``


        You can sort results via ``field`` and ``order`` query parameters. Supported sort fields:

        - ``updated_at``, ``created_at``, ``name``, ``pipeline_name``

        - Directions: ``ASC``, ``DESC``

        - Sort applies to the full result set before pagination.


        Status filter semantics — ``filter=status eq ''''`` accepts only the persisted

        ``DeploymentStatus`` values:

        - ``DEPLOYED`` (UI: Active): filterable

        - ``UNDEPLOYED`` (UI: Inactive): filterable

        - ``DEPLOYMENT_IN_PROGRESS`` (UI: Starting): filterable

        - ``DEPLOYMENT_FAILED`` (UI: Failed): filterable

        - ``IDLE`` (UI: Standby): accepted but returns 0 rows — derived at read time, never persisted

        Any other value returns 422. UI-only states such as "No version published" (no active revision)

        are not filterable.


        Example requests:

        - ``?limit=10&page_number=1``

        - ``?filter=status eq ''DEPLOYED''&limit=10``

        - ``?filter=status eq ''IDLE''&limit=10``

        - ``?filter=pipeline_name eq ''{pipeline-name}''&limit=10``

        - ``?filter=status eq ''DEPLOYED'' and pipeline_name eq ''{pipeline-name}''&limit=10``

        - ``?field=pipeline_name&order=ASC&limit=10``

        - ``?field=pipeline_name&order=DESC&limit=10``

        - ``?field=updated_at&order=DESC&limit=10``'
      operationId: list_deployments_api_v1_workspaces__workspace_name__deployments_get
      parameters:
      - description: Type the name of the workspace.
        in: path
        name: workspace_name
        required: true
        schema:
          description: Type the name of the workspace.
          title: Workspace Name
          type: string
      - description: Filter deployments by group label.
        in: query
        name: group_label
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Filter deployments by group label.
          title: Group Label
      - description: Filter deployments that have any of the listed tags. Repeat the parameter for multiple values, e.g. ?tags=production&tags=support. Matching is case-insensitive.
        in: query
        name: tags
        required: false
        schema:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          description: Filter deployments that have any of the listed tags. Repeat the parameter for multiple values, e.g. ?tags=production&tags=support. Matching is case-insensitive.
          title: Tags
      - description: 'The OData filter you want to use to in your query. It supports exact match and `AND` operations. For example, to filter for a metadata `category:news` and `published_date` greater than or equal to January 1 2025, here''s what the URL could look like: ''url = "https://api.cloud.deepset.ai/api/v1/workspaces/production/files?limit=10&filter=category eq ''news'' and published_date ge ''2025-01-01'' "''. OData filters only work with cursor-based pagination (leave the `page_number` field blank to enable it).To learn more about the OData filter syntax, see: [Querying Data](https://www.odata.org/getting-started/basic-tutorial/#queryData).<br/><br/>Supported filter fields:<ul><li>`pipeline_name`</li><li>`status`</li></ul>'
        in: query
        name: filter
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: 'The OData filter you want to use to in your query. It supports exact match and `AND` operations. For example, to filter for a metadata `category:news` and `published_date` greater than or equal to January 1 2025, here''s what the URL could look like: ''url = "https://api.cloud.deepset.ai/api/v1/workspaces/production/files?limit=10&filter=category eq ''news'' and published_date ge ''2025-01-01'' "''. OData filters only work with cursor-based pagination (leave the `page_number` field blank to enable it).To learn more about the OData filter syntax, see: [Querying Data](https://www.odata.org/getting-started/basic-tutorial/#queryData).<br/><br/>Supported filter fields:<ul><li>`pipeline_name`</li><li>`status`</li></ul>'
          title: Filter
      - description: The number of entries to display. Leaving this field empty keeps the default, and max 10 results are returned.
        in: query
        name: limit
        required: false
        schema:
          default: 10
          description: The number of entries to display. Leaving this field empty keeps the default, and max 10 results are returned.
          maximum: 100
          title: Limit
          type: integer
      - description: Enter an ID if you want to see all entries before this ID. To use this option, clear the `page_number` parameter first.
        in: query
        name: before
        required: false
        schema:
          anyOf:
          - format: uuid
            type: string
          - type: 'null'
          description: Enter an ID if you want to see all entries before this ID. To use this option, clear the `page_number` parameter first.
          title: Before
      - description: Enter an ID if you want to see all entries after this ID. To use this option, clear the `page_number` parameter first.
        in: query
        name: after
        required: false
        schema:
          anyOf:
          - format: uuid
            type: string
          - type: 'null'
          description: Enter an ID if you want to see all entries after this ID. To use this option, clear the `page_number` parameter first.
          title: After
      - description: The number of the page you want to see.
        in: query
        name: page_number
        required: false
        schema:
          anyOf:
          - minimum: 1
            type: integer
          - type: 'null'
          description: The number of the page you want to see.
          title: Page Number
      - description: The name of the entity you want to sort by.<br/><br/>Supported values:<ul><li>`created_at`</li><li>`name`</li><li>`pipeline_name`</li><li>`updated_at`</li></ul>
        in: query
        name: field
        required: false
        schema:
          default: updated_at
          description: The name of the entity you want to sort by.<br/><br/>Supported values:<ul><li>`created_at`</li><li>`name`</li><li>`pipeline_name`</li><li>`updated_at`</li></ul>
          enum:
          - updated_at
          - created_at
          - name
          - pipeline_name
          title: Field
          type: string
      - description: Sort order.
        in: query
        name: order
        required: false
        schema:
          default: DESC
          description: Sort order.
          enum:
          - ASC
          - DESC
          title: Order
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedResult_DeploymentResponse_'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - HTTPBearer: []
      summary: List Deployments
      tags:
      - Deployments
      x-deepset-permissions:
        action: read
        asset: services
        asset_description: 'Access to services (deployments): create, update, publish and query.'
        type: workspace
    post:
      description: 'Create a deployment bucket, optionally linked to a pipeline.


        Default service sizing follows Development unless explicit sizing fields are provided.

        You can pass up to three tags, which follow the same rules as adding a tag to an existing

        deployment. If any tag is invalid, the request fails and no deployment is created.'
      operationId: create_deployment_api_v1_workspaces__workspace_name__deployments_post
      parameters:
      - description: Type the name of the workspace.
        in: path
        name: workspace_name
        required: true
        schema:
          description: Type the name of the workspace.
          title: Workspace Name
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDeploymentRequest'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeploymentResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - HTTPBearer: []
      summary: Create Deployment
      tags:
      - Deployments
      x-deepset-permissions:
        action: write
        asset: services
        asset_description: 'Access to services (deployments): create, update, publish and query.'
        type: workspace
  /api/v1/workspaces/{workspace_name}/deployments/v1/chat/completions:
    post:
      description: 'Run a deployment''s active revision as a chat completion (OpenAI-style).


        The chat completion endpoint sends a list of conversation messages to an AI model and returns

        the next assistant response. For multi-turn chats, clients maintain the history by including prior

        user and assistant messages in each request, along with the new user message. The run is stored

        in search history so you can inspect traces.


        By default (``stream: false``), a single JSON response is returned once generation completes.

        Pass ``stream: true`` to instead receive the response streamed as SSE.


        `model` identifies which deployed service to run, as `{workspace_name}/{deployment_id}`.


        Example request:

        ```json

        {

        "messages": [

        {"role": "user", "content": "How does streaming work with Haystack Enterprise Platform?"}

        ],

        "model": "my_workspace/3fa85f64-5717-4562-b3fc-2c963f66afa6"

        }

        ```


        Example non-streaming (``stream: false``, the default) response:

        ```json

        {

        "id": "chatcmpl-123",

        "object": "chat.completion",

        "created": 1730000000,

        "model": "my_workspace/3fa85f64-5717-4562-b3fc-2c963f66afa6",

        "choices": [

        {

        "index": 0,

        "message": {"role": "assistant", "content": "Streaming sends the response as SSE chunks."},

        "finish_reason": "stop"

        }

        ]

        }

        ```


        ### Extra OpenAI parameters


        You can send extra OpenAI fields besides ``messages``, ``model``, and ``stream``, for example

        ``temperature``, ``top_p``, and other generation parameters. They are placed in a

        ``generation_kwargs`` dict and passed to the deployed service as a named input.


        OpenAI-style ``tools`` and ``tool_choice`` are not supported and are ignored from the request.


        Example request:

        ```json

        {

        "messages": [{"role": "user", "content": "What''s the weather in Berlin?"}],

        "model": "my_workspace/3fa85f64-5717-4562-b3fc-2c963f66afa6",

        "temperature": 1.0,

        "max_completion_tokens": 512

        }

        ```


        The Agent receives those values when the revision YAML ``inputs`` mapping names

        ``generation_kwargs``:


        ```yaml

        inputs:

        messages:

        - agent.messages

        generation_kwargs:

        - agent.generation_kwargs

        ```


        ``generation_kwargs`` is merged into the agent''s chat generator at run time.


        ### Tools


        Client-side OpenAI-style ``tools`` and ``tool_choice`` are not supported. If the deployed service

        uses an ``Agent`` with its own configured tools, those pipeline tools still run inside the service.


        ### File references


        A message can reference a file already stored in this workspace via a ``file`` content part:

        ``{"type": "file", "file": {"file_id": ""}}``. ``file_id`` must be a UUID of a file in this

        workspace, not an OpenAI file id. You can also send inline ``file_data`` (a base64 data URL)

        or an ``image_url`` part with a base64 data URL. ``input_audio`` parts and HTTP ``image_url``s

        are ignored; they do not fail the request.'
      operationId: chat_completions_api_v1_workspaces__workspace_name__deployments_v1_chat_completions_post
      parameters:
      - description: Type the name of the workspace.
        in: path
        name: workspace_name
        required: true
        schema:
          description: Type the name of the workspace.
          title: Workspace Name
          type: string
      - description: 'Set to `off` to suppress the `: keep-alive` comment lines that the stream sends while it waits for pipeline output. Set to `on` or omit the header to keep them.'
        in: header
        name: X-Deepset-Stream-Keepalive
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: 'Set to `off` to suppress the `: keep-alive` comment lines that the stream sends while it waits for pipeline output. Set to `on` or omit the header to keep them.'
          title: X-Deepset-Stream-Keepalive
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeploymentChatCompletionRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema: {}
            text/event-stream: {}
          description: Streaming response from the deployed service (SSE) when `stream` is true, or a single JSON `chat.completion` object when `stream` is false (default).
        '400':
          description: No user message in messages, the deployed service has no query input, the 'model' field's workspace doesn't match the URL workspace, or a file content part's file_id is not a UUID.
        '404':
          description: We couldn't find the deployed service. Check if the deployment ID is correct, make sure the deployed service exists in the workspace you specified, and try again.
        '409':
          description: The deployed service was in a conflicted state (for example, it wasn't deployed).
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
        '503':
          description: The deployed service is unavailable or the run failed before a completion was produced. Retry the request.
      security:
      - HTTPBearer: []
      summary: Chat Completions
      tags:
      - Deployments
      x-deepset-permissions:
        action: read
        asset: services
        asset_description: 'Access to services (deployments): create, update, publish and query.'
        type: workspace
  /api/v1/workspaces/{workspace_name}/deployments/v1/models/:
    get:
      description: 'List the workspace''s deployed services as OpenAI-compatible models.


        This is an OpenAI-compatible ``/v1/models`` endpoint, for

        integrations to discover deployed services (for example, Open WebUI or Thunderbolt), paired with

        ``POST /workspaces/{workspace_name}/deployments/v1/chat/completions``.


        Each model''s ``id`` is formatted as ``{workspace_name}/{deployment_id}`` - the same pair

        the chat-completions endpoint expects as the ``model`` parameter.'
      operationId: list_models_api_v1_workspaces__workspace_name__deployments_v1_models__get
      parameters:
      - description: Type the name of the workspace.
        in: path
        name: workspace_name
        required: true
        schema:
          description: Type the name of the workspace.
          title: Workspace Name
          type: string
      responses:
        '200':
