            application/json:
              schema:
                $ref: '#/components/schemas/ModelsListResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - HTTPBearer: []
      summary: List Models
      tags:
      - Deployments
      x-deepset-permissions:
        action: read
        asset: services
        asset_description: 'Access to services (deployments): create, update, publish and query.'
        type: workspace
  /api/v1/workspaces/{workspace_name}/deployments/{deployment_id}:
    delete:
      description: You delete a service and its revisions. Set discard_durable_history to close durable admission and discard completed durable run history and results. Unfinished or unknown runs return 409 with admission closed. During host removal, you receive 202 and retry the same request until you receive 204.
      operationId: delete_deployment_api_v1_workspaces__workspace_name__deployments__deployment_id__delete
      parameters:
      - description: Deployment ID
        in: path
        name: deployment_id
        required: true
        schema:
          description: Deployment ID
          format: uuid
          title: Deployment Id
          type: string
      - description: Type the name of the workspace.
        in: path
        name: workspace_name
        required: true
        schema:
          description: Type the name of the workspace.
          title: Workspace Name
          type: string
      - description: You discard completed durable run history and results.
        in: query
        name: discard_durable_history
        required: false
        schema:
          default: false
          description: You discard completed durable run history and results.
          title: Discard Durable History
          type: boolean
      responses:
        '202':
          description: You retry deletion after durable host removal completes.
        '204':
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - HTTPBearer: []
      summary: Delete Deployment
      tags:
      - Deployments
      x-deepset-permissions:
        action: write
        asset: services
        asset_description: 'Access to services (deployments): create, update, publish and query.'
        type: workspace
    get:
      description: Get deployment details including the active revision and runtime status.
      operationId: get_deployment_api_v1_workspaces__workspace_name__deployments__deployment_id__get
      parameters:
      - description: Deployment ID
        in: path
        name: deployment_id
        required: true
        schema:
          description: Deployment ID
          format: uuid
          title: Deployment Id
          type: string
      - description: Type the name of the workspace.
        in: path
        name: workspace_name
        required: true
        schema:
          description: Type the name of the workspace.
          title: Workspace Name
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeploymentResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - HTTPBearer: []
      summary: Get Deployment
      tags:
      - Deployments
      x-deepset-permissions:
        action: read
        asset: services
        asset_description: 'Access to services (deployments): create, update, publish and query.'
        type: workspace
    patch:
      description: Update deployment metadata, sizing, or execution mode.
      operationId: patch_deployment_api_v1_workspaces__workspace_name__deployments__deployment_id__patch
      parameters:
      - description: Deployment ID
        in: path
        name: deployment_id
        required: true
        schema:
          description: Deployment ID
          format: uuid
          title: Deployment Id
          type: string
      - description: Type the name of the workspace.
        in: path
        name: workspace_name
        required: true
        schema:
          description: Type the name of the workspace.
          title: Workspace Name
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateDeploymentRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeploymentResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - HTTPBearer: []
      summary: Patch Deployment
      tags:
      - Deployments
      x-deepset-permissions:
        action: write
        asset: services
        asset_description: 'Access to services (deployments): create, update, publish and query.'
        type: workspace
