          description: If False, the query and response are not persisted to the chat history for the given search_session_id. Opting out is only supported by deployed services with a SERVERLESS execution mode.
          title: Store Search History
          type: boolean
        view_prompts:
          default: false
          deprecated: true
          description: Adds the runtime prompts of all nodes to the response. (The deployed service's pipeline runs in debug mode.)
          title: View prompts
