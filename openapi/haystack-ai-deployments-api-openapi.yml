            type: string
          - type: 'null'
          description: 'The ID of the search session to use for chat history. Optional: if omitted, a new search session owned by the deployed service you''re querying is created automatically and its ID is returned in the `X-Search-Session-Id` response header.'
          title: Search Session ID
        store_search_history:
