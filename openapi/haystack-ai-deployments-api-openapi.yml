            ```json

            {"query_id": "e2084408-48f8-4f52-9b59-43dd924705ef", "type": "reasoning", "reasoning": {"reasoning_text": "This is the plan:\nStep 1: Retrieve documents\nStep 2: Process documents\nStep 3: Generate answer", "extra": {}}}

            ```'
          title: Include Reasoning
          type: boolean
        include_result:
          default: false
          description: Includes the result of the pipeline or deploed service at the end of the stream under key 'result'.
          title: Include Result
          type: boolean
