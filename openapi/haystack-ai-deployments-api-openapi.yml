  /api/v1/workspaces/{workspace_name}/deployments/{deployment_id}/chat-stream:
    post:
      description: 'Run a chat query against a deployed service, streaming the response as Server-Sent Events, using prior

        turns from a search session as chat history. The chat history of a search session is passed automatically to deployed services that are designed for

        conversations. You can specify how many search history items (query and answer) from a given search session

        you want to display in the chat. You''ll need a search session ID to group queries into a conversation. If omitted, a new session is

        created automatically and returned in the `X-Search-Session-Id` response header for reuse in subsequent

        requests. Use the search session endpoints for deployed services to manage search sessions. Example request:

        ```json

        {

        "query": "How does streaming work with Haystack Enterprise Platform?",

        "search_session_id": "3fa85f64-5717-4562-b3fc-2c963f66afa6"

        }

        ```


        Options:

        - `search_session_id` groups queries into a conversation, allowing them to use previous queries and answers

        as chat history. If omitted, a new session is created automatically. Its ID is returned in the

        `X-Search-Session-Id` response header for reuse in subsequent requests. - Tool calls are streamed if `include_tool_calls=True` (default `rendered`, converted to markdown text deltas). - Tool call results are streamed if `include_tool_call_results=True`. - Reasoning output is streamed if `include_reasoning=True`. Ping events are connection status, not answer text. `{"type":"ping"}` is a heartbeat, while

        `{"type":"ping","phase":"cold_start"}` tells you that temporary infrastructure and pipeline preparation is

        still running. You can ignore either form. After you receive a ping, later failures arrive as one terminal

        `error` event over the HTTP 200 stream and are not followed by `done`.'
      operationId: chat_stream_api_v1_workspaces__workspace_name__deployments__deployment_id__chat_stream_post
      parameters:
      - description: Deployment ID
        in: path
        name: deployment_id
        required: true
        schema:
          description: Deployment ID
          format: uuid
          title: Deployment Id
          type: string
      - description: Type the name of the workspace.
        in: path
        name: workspace_name
        required: true
        schema:
          description: Type the name of the workspace.
          title: Workspace Name
          type: string
      - description: 'Set to `off` to suppress the `: keep-alive` comment lines that the stream sends while it waits for pipeline output. Set to `on` or omit the header to keep them.'
        in: header
        name: X-Deepset-Stream-Keepalive
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: 'Set to `off` to suppress the `: keep-alive` comment lines that the stream sends while it waits for pipeline output. Set to `on` or omit the header to keep them.'
          title: X-Deepset-Stream-Keepalive
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeploymentChatStreamingQuery'
        required: true
      responses:
        '200':
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - HTTPBearer: []
      summary: Chat Stream
      tags:
      - Deployments
      x-deepset-permissions:
        action: read
        asset: services
        asset_description: 'Access to services (deployments): create, update, publish and query.'
        type: workspace
