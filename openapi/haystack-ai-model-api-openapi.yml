components:
  schemas:
    ModelOrigin:
      enum:
      - WORKSPACE
      - ORGANIZATION
      - PLATFORM
      title: ModelOrigin
      type: string
    UserIdName:
      properties:
        family_name:
          description: Family name of a user.
          title: Family name
          type: string
        given_name:
          description: Given name of a user.
          title: Given name
          type: string
        user_id:
          description: Unique identifier of a user.
          format: uuid
          title: User ID
          type: string
      required:
      - given_name
      - family_name
      - user_id
      title: Oauth User
      type: object
    ValidationError:
      properties:
        ctx:
          title: Context
          type: object
        input:
          title: Input
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          title: Location
          type: array
        msg:
          title: Message
          type: string
        type:
          title: Error Type
          type: string
      required:
      - loc
      - msg
      - type
      title: ValidationError
      type: object
    CreateModelRequest:
      properties:
        chat_generator_config:
          additionalProperties: true
          description: The configuration for the chat generator as expected in a pipeline YAML
          title: Chat Generator Config
          type: object
        generation_kwargs:
          additionalProperties: true
          description: The available generation kwargs for the model as OpenAPI schema
          title: Generation Kwargs
          type: object
        name:
          description: The name of the model, e.g., 'gpt-5' or 'Claude 4 Sonnet'
          title: Name
          type: string
        provider:
          description: The provider of the model, e.g., 'openai' or 'anthropic'
          title: Provider
          type: string
      required:
      - name
      - provider
      - chat_generator_config
      - generation_kwargs
      title: CreateModelRequest
      type: object
    ModelValidationError:
      properties:
        category:
          default: ERROR
          enum:
          - ERROR
          - WARNING
          title: Category
          type: string
        code:
          anyOf:
          - type: string
          - type: 'null'
          title: Code
        env_var:
          anyOf:
          - type: string
          - type: 'null'
          title: Env Var
        message:
          anyOf:
          - type: string
          - type: 'null'
          title: Message
        title:
          anyOf:
          - type: string
          - type: 'null'
          title: Title
      title: ModelValidationError
      type: object
    ValidateGenerationKwargsRequest:
      properties:
        generation_kwargs:
          additionalProperties: true
          description: The available generation kwargs for the model as OpenAPI schema
          title: Generation Kwargs
          type: object
      required:
      - generation_kwargs
      title: ValidateGenerationKwargsRequest
      type: object
    ModelValidationResult:
      properties:
        errors:
          anyOf:
          - items:
              $ref: '#/components/schemas/ModelValidationError'
            type: array
          - type: 'null'
          title: Errors
        valid:
          title: Valid
          type: boolean
      required:
      - valid
      title: ModelValidationResult
      type: object
    ValidateModelRequest:
      properties:
        chat_generator_config:
          additionalProperties: true
          description: The configuration for the chat generator as expected in a pipeline YAML
          title: Chat Generator Config
          type: object
      required:
      - chat_generator_config
      title: ValidateModelRequest
      type: object
    UpdateModelRequest:
      properties:
        chat_generator_config:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          description: The configuration for the chat generator as expected in a pipeline YAML
          title: Chat Generator Config
        generation_kwargs:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          description: The available generation kwargs for the model as OpenAPI schema
          title: Generation Kwargs
        name:
          anyOf:
          - type: string
          - type: 'null'
          description: The name of the model, e.g., 'gpt-5' or 'Claude 4 Sonnet'
          title: Name
        provider:
          anyOf:
          - type: string
