openapi: 3.2.0
info:
  description: deepset API description
  title: Haystack Enterprise Platform Model API
  version: 1.0.0
servers:
- description: deepset Europe
  url: https://api.cloud.deepset.ai
- description: deepset US
  url: https://api.us.deepset.ai
tags:
- name: Model
paths:
  /api/v2/models/custom:
    get:
      description: 'Returns organization-level custom model definitions.


        Supports OData ``$filter`` on ``name`` and ``provider``.'
      operationId: get_organization_custom_models_api_v2_models_custom_get
      parameters:
      - description: The number of entries to display. Leaving this field empty keeps the default, and max 10 results are returned.
        in: query
        name: limit
        required: false
        schema:
          default: 10
          description: The number of entries to display. Leaving this field empty keeps the default, and max 10 results are returned.
          maximum: 100
          title: Limit
          type: integer
      - description: Enter an ID if you want to see all entries before this ID. To use this option, clear the `page_number` parameter first.
        in: query
        name: before
        required: false
        schema:
          anyOf:
          - format: uuid
            type: string
          - type: 'null'
          description: Enter an ID if you want to see all entries before this ID. To use this option, clear the `page_number` parameter first.
          title: Before
      - description: Enter an ID if you want to see all entries after this ID. To use this option, clear the `page_number` parameter first.
        in: query
        name: after
        required: false
        schema:
          anyOf:
          - format: uuid
            type: string
          - type: 'null'
          description: Enter an ID if you want to see all entries after this ID. To use this option, clear the `page_number` parameter first.
          title: After
      - description: The number of the page you want to see.
        in: query
        name: page_number
        required: false
        schema:
          anyOf:
          - minimum: 1
            type: integer
          - type: 'null'
          description: The number of the page you want to see.
          title: Page Number
      - description: The name of the entity you want to sort by.<br/><br/>Supported values:<ul><li>`created_at`</li><li>`name`</li><li>`provider`</li></ul>
        in: query
        name: field
        required: false
        schema:
          default: created_at
          description: The name of the entity you want to sort by.<br/><br/>Supported values:<ul><li>`created_at`</li><li>`name`</li><li>`provider`</li></ul>
          enum:
          - name
          - provider
          - created_at
          title: Field
          type: string
      - description: Choose how you want to sort the results.
        in: query
        name: order
        required: false
        schema:
          default: DESC
          description: Choose how you want to sort the results.
          enum:
          - ASC
          - DESC
          title: Order
          type: string
      - description: 'The OData filter you want to use to in your query. It supports exact match and `AND` operations. For example, to filter for a metadata `category:news` and `published_date` greater than or equal to January 1 2025, here''s what the URL could look like: ''url = "https://api.cloud.deepset.ai/api/v1/workspaces/production/files?limit=10&filter=category eq ''news'' and published_date ge ''2025-01-01'' "''. OData filters only work with cursor-based pagination (leave the `page_number` field blank to enable it).To learn more about the OData filter syntax, see: [Querying Data](https://www.odata.org/getting-started/basic-tutorial/#queryData).'
        in: query
        name: filter
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: 'The OData filter you want to use to in your query. It supports exact match and `AND` operations. For example, to filter for a metadata `category:news` and `published_date` greater than or equal to January 1 2025, here''s what the URL could look like: ''url = "https://api.cloud.deepset.ai/api/v1/workspaces/production/files?limit=10&filter=category eq ''news'' and published_date ge ''2025-01-01'' "''. OData filters only work with cursor-based pagination (leave the `page_number` field blank to enable it).To learn more about the OData filter syntax, see: [Querying Data](https://www.odata.org/getting-started/basic-tutorial/#queryData).'
          title: Filter
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedResult_Model_'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - HTTPBearer: []
      summary: Get Organization Custom Models
      tags:
      - Model
      x-deepset-permissions:
        required_roles:
        - ADMIN
        - MEMBER
        type: organization
    post:
      description: Creates a new organization-level custom model definition.
      operationId: create_organization_model_api_v2_models_custom_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateModelRequest'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Model'
          description: Successful Response
        '409':
          description: A model with this name already exists.
        '422':
          description: The model configuration is invalid.
      security:
      - HTTPBearer: []
      summary: Create Organization Model
      tags:
      - Model
      x-deepset-permissions:
        required_roles:
        - ADMIN
        type: organization
  /api/v2/models/custom/validate:
    post:
      description: Validates the chat_generator_config for an organization-level custom model.
      operationId: validate_organization_model_api_v2_models_custom_validate_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ValidateModelRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelValidationResult'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - HTTPBearer: []
      summary: Validate Organization Model
      tags:
      - Model
      x-deepset-permissions:
        required_roles:
        - ADMIN
        - MEMBER
        type: organization
  /api/v2/models/custom/validate-generation-kwargs:
    post:
      description: 'Validates model parameters schema: checks that it is a valid JSON schema.'
      operationId: validate_organization_generation_kwargs_api_v2_models_custom_validate_generation_kwargs_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ValidateGenerationKwargsRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelValidationResult'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - HTTPBearer: []
      summary: Validate Organization Generation Kwargs
      tags:
      - Model
      x-deepset-permissions:
        required_roles:
        - ADMIN
        - MEMBER
        type: organization
  /api/v2/models/custom/{model_id}:
    delete:
      description: Deletes an organization-level custom model definition.
      operationId: delete_organization_model_api_v2_models_custom__model_id__delete
      parameters:
      - description: The unique identifier of the model.
        in: path
        name: model_id
        required: true
        schema:
          description: The unique identifier of the model.
          format: uuid
          title: Model Id
          type: string
      responses:
        '204':
          description: Successful Response
        '404':
          description: We couldn't find the model with this ID. Check the ID and try again.
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - HTTPBearer: []
      summary: Delete Organization Model
      tags:
      - Model
      x-deepset-permissions:
        required_roles:
        - ADMIN
        type: organization
    patch:
      description: Updates an existing organization-level custom model definition.
      operationId: update_organization_model_api_v2_models_custom__model_id__patch
      parameters:
      - description: The unique identifier of the model.
        in: path
        name: model_id
        required: true
        schema:
          description: The unique identifier of the model.
          format: uuid
          title: Model Id
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateModelRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Model'
          description: Successful Response
        '404':
          description: We couldn't find a model with this ID. Check the ID and try again.
        '409':
          description: A model with this name already exists.
        '422':
          description: The model configuration is invalid.
      security:
      - HTTPBearer: []
      summary: Update Organization Model
      tags:
      - Model
      x-deepset-permissions:
        required_roles:
        - ADMIN
        type: organization
  /api/v2/workspaces/{workspace_id}/models:
    get:
      description: 'Returns the available models for a workspace.


        Custom models (workspace- and org-scoped) are listed first, followed by

        predefined models from the integration gateway.'
      operationId: get_workspace_models_api_v2_workspaces__workspace_id__models_get
      parameters:
      - description: Type the id of the workspace.
        in: path
        name: workspace_id
        required: true
        schema:
          description: Type the id of the workspace.
          format: uuid
          title: Workspace Id
          type: string
      - description: Filter by connection status.
        in: query
        name: connected
        required: false
        schema:
          anyOf:
          - type: boolean
          - type: 'null'
          description: Filter by connection status.
          title: Connected
      - description: The number of entries to display. Leaving this field empty keeps the default, and max 10 results are returned.
        in: query
        name: limit
        required: false
        schema:
          default: 10
          description: The number of entries to display. Leaving this field empty keeps the default, and max 10 results are returned.
          maximum: 100
          title: Limit
          type: integer
      - description: Enter an ID if you want to see all entries before this ID. To use this option, clear the `page_number` parameter first.
        in: query
        name: before
        required: false
        schema:
          anyOf:
          - format: uuid
            type: string
          - type: 'null'
          description: Enter an ID if you want to see all entries before this ID. To use this option, clear the `page_number` parameter first.
          title: Before
      - description: Enter an ID if you want to see all entries after this ID. To use this option, clear the `page_number` parameter first.
        in: query
        name: after
        required: false
        schema:
          anyOf:
          - format: uuid
            type: string
          - type: 'null'
          description: Enter an ID if you want to see all entries after this ID. To use this option, clear the `page_number` parameter first.
          title: After
      - description: The number of the page you want to see.
        in: query
        name: page_number
        required: false
        schema:
          anyOf:
          - minimum: 1
            type: integer
          - type: 'null'
          description: The number of the page you want to see.
          title: Page Number
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedResult_Model_'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - HTTPBearer: []
      summary: Get Workspace Models
      tags:
      - Model
      x-deepset-permissions:
        action: read
        asset: models
        asset_description: Access to model definitions in a workspace.
        type: workspace
