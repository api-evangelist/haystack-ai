openapi: 3.2.0
info:
  description: deepset API description
  title: Haystack Enterprise Platform Jobs API
  version: 1.0.0
servers:
- description: deepset Europe
  url: https://api.cloud.deepset.ai
- description: deepset US
  url: https://api.us.deepset.ai
tags:
- name: Jobs
paths:
  /api/v2/shared_jobs/{link}:
    get:
      description: Publicly resolve a shared job link and return the job's results. No deepset Cloud login is required unless the link was created with login_required=true, in which case a valid session is required (but not membership in the job's workspace).
      operationId: get_shared_job_by_link_api_v2_shared_jobs__link__get
      parameters:
      - in: path
        name: link
        required: true
        schema:
          title: Link
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicSharedJobResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - HTTPBearer: []
      summary: Get Shared Job By Link
      tags:
      - Jobs
  /api/v2/workspaces/{workspace_id}/jobs:
    get:
      description: List batch jobs in this workspace, most recently created first.
      operationId: list_jobs_api_v2_workspaces__workspace_id__jobs_get
      parameters:
      - description: Type the id of the workspace.
        in: path
        name: workspace_id
        required: true
        schema:
          description: Type the id of the workspace.
          format: uuid
          title: Workspace Id
          type: string
      - description: The number of entries to display. Leaving this field empty keeps the default, and max 10 results are returned.
        in: query
        name: limit
        required: false
        schema:
          default: 10
          description: The number of entries to display. Leaving this field empty keeps the default, and max 10 results are returned.
          maximum: 100
          title: Limit
          type: integer
      - description: Enter an ID if you want to see all entries before this ID. To use this option, clear the `page_number` parameter first.
        in: query
        name: before
        required: false
        schema:
          anyOf:
          - format: uuid
            type: string
          - type: 'null'
          description: Enter an ID if you want to see all entries before this ID. To use this option, clear the `page_number` parameter first.
          title: Before
      - description: Enter an ID if you want to see all entries after this ID. To use this option, clear the `page_number` parameter first.
        in: query
        name: after
        required: false
        schema:
          anyOf:
          - format: uuid
            type: string
          - type: 'null'
          description: Enter an ID if you want to see all entries after this ID. To use this option, clear the `page_number` parameter first.
          title: After
      - description: The number of the page you want to see.
        in: query
        name: page_number
        required: false
        schema:
          anyOf:
          - minimum: 1
            type: integer
          - type: 'null'
          description: The number of the page you want to see.
          title: Page Number
      - description: The name of the entity you want to sort by.<br/><br/>Supported values:<ul><li>`created_at`</li><li>`name`</li></ul>
        in: query
        name: field
        required: false
        schema:
          default: created_at
          description: The name of the entity you want to sort by.<br/><br/>Supported values:<ul><li>`created_at`</li><li>`name`</li></ul>
          enum:
          - name
          - created_at
          title: Field
          type: string
      - description: Choose how you want to sort the results.
        in: query
        name: order
        required: false
        schema:
          default: DESC
          description: Choose how you want to sort the results.
          enum:
          - ASC
          - DESC
          title: Order
          type: string
      - description: 'Partial implementation of the OData $select operator. It currently only supports selecting fields from the root entity or a child entity. Selecting fields from children''s children is not supported. If you use this parameter, the API answer is always a flat list of distinct JSON objects with the selected properties, for example, ''[{"given_name": "user1", "user_id": "..."}, ...]'' for ''select=created_by/given_name, created_by/user_id''. The results are ordered by the first selected attribute. To learn more about the OData filter syntax, see: [Querying Data](https://www.odata.org/getting-started/basic-tutorial/#queryData).'
        in: query
        name: select
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: 'Partial implementation of the OData $select operator. It currently only supports selecting fields from the root entity or a child entity. Selecting fields from children''s children is not supported. If you use this parameter, the API answer is always a flat list of distinct JSON objects with the selected properties, for example, ''[{"given_name": "user1", "user_id": "..."}, ...]'' for ''select=created_by/given_name, created_by/user_id''. The results are ordered by the first selected attribute. To learn more about the OData filter syntax, see: [Querying Data](https://www.odata.org/getting-started/basic-tutorial/#queryData).'
          title: Select
      - description: 'The OData filter you want to use to in your query. It supports exact match and `AND` operations. For example, to filter for a metadata `category:news` and `published_date` greater than or equal to January 1 2025, here''s what the URL could look like: ''url = "https://api.cloud.deepset.ai/api/v1/workspaces/production/files?limit=10&filter=category eq ''news'' and published_date ge ''2025-01-01'' "''. OData filters only work with cursor-based pagination (leave the `page_number` field blank to enable it).To learn more about the OData filter syntax, see: [Querying Data](https://www.odata.org/getting-started/basic-tutorial/#queryData).'
        in: query
        name: filter
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: 'The OData filter you want to use to in your query. It supports exact match and `AND` operations. For example, to filter for a metadata `category:news` and `published_date` greater than or equal to January 1 2025, here''s what the URL could look like: ''url = "https://api.cloud.deepset.ai/api/v1/workspaces/production/files?limit=10&filter=category eq ''news'' and published_date ge ''2025-01-01'' "''. OData filters only work with cursor-based pagination (leave the `page_number` field blank to enable it).To learn more about the OData filter syntax, see: [Querying Data](https://www.odata.org/getting-started/basic-tutorial/#queryData).'
          title: Filter
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedJobs'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - HTTPBearer: []
      summary: List Jobs
      tags:
      - Jobs
      x-deepset-permissions:
        action: read
        asset: jobs
        asset_description: Access to jobs details
        type: workspace
    post:
      description: Create a batch job against a pipeline, either referencing an existing query set via 'query_set_id' or providing 'queries' inline (an inline query set is created for you). The job is not run until 'POST .../jobs/{job_id}/start' is called.
      operationId: create_job_api_v2_workspaces__workspace_id__jobs_post
      parameters:
      - description: Type the id of the workspace.
        in: path
        name: workspace_id
        required: true
        schema:
          description: Type the id of the workspace.
          format: uuid
          title: Workspace Id
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateJob'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - HTTPBearer: []
      summary: Create Job
      tags:
      - Jobs
      x-deepset-permissions:
        action: write
        asset: jobs
        asset_description: Access to jobs details
        type: workspace
  /api/v2/workspaces/{workspace_id}/jobs/filters/created-by:
    get:
      description: Distinct set of users who have created a job in this workspace, for filter dropdowns.
      operationId: list_job_creators_api_v2_workspaces__workspace_id__jobs_filters_created_by_get
      parameters:
      - description: Type the id of the workspace.
        in: path
        name: workspace_id
        required: true
        schema:
          description: Type the id of the workspace.
          format: uuid
          title: Workspace Id
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/UserIdName'
                title: Response List Job Creators Api V2 Workspaces  Workspace Id  Jobs Filters Created By Get
                type: array
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - HTTPBearer: []
      summary: List Job Creators
      tags:
      - Jobs
      x-deepset-permissions:
        action: read
        asset: jobs
        asset_description: Access to jobs details
        type: workspace
  /api/v2/workspaces/{workspace_id}/jobs/share:
    post:
      description: Create an externally-shareable, revocable link exposing a job's results.
      operationId: share_job_api_v2_workspaces__workspace_id__jobs_share_post
      parameters:
      - description: Type the id of the workspace.
        in: path
        name: workspace_id
        required: true
        schema:
          description: Type the id of the workspace.
          format: uuid
          title: Workspace Id
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSharedJob'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SharedJobResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - HTTPBearer: []
      summary: Share Job
      tags:
      - Jobs
      x-deepset-permissions:
        action: write
        asset: jobs
        asset_description: Access to jobs details
        type: workspace
  /api/v2/workspaces/{workspace_id}/jobs/{job_id}:
    delete:
      description: Delete a job and its results. Returns 409 if the job is currently STARTED.
      operationId: delete_job_api_v2_workspaces__workspace_id__jobs__job_id__delete
      parameters:
      - in: path
        name: job_id
        required: true
        schema:
          format: uuid
          title: Job Id
          type: string
      - description: Type the id of the workspace.
        in: path
        name: workspace_id
        required: true
        schema:
          description: Type the id of the workspace.
          format: uuid
          title: Workspace Id
          type: string
      responses:
        '204':
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - HTTPBearer: []
      summary: Delete Job
      tags:
      - Jobs
      x-deepset-permissions:
        action: write
        asset: jobs
        asset_description: Access to jobs details
        type: workspace
    get:
      description: Get a single job by ID, including its current status and progress counters.
      operationId: get_job_api_v2_workspaces__workspace_id__jobs__job_id__get
      parameters:
      - in: path
        name: job_id
        required: true
        schema:
          format: uuid
          title: Job Id
          type: string
      - description: Type the id of the workspace.
        in: path
        name: workspace_id
        required: true
        schema:
          description: Type the id of the workspace.
          format: uuid
          title: Workspace Id
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - HTTPBearer: []
      summary: Get Job
      tags:
      - Jobs
      x-deepset-permissions:
        action: read
        asset: jobs
        asset_description: Access to jobs details
        type: workspace
    patch:
      description: Update a job's editable fields. Only fields present in the request body are changed. Returns 409 if the job is currently STARTED (wait for it to finish first).
      operationId: update_job_api_v2_workspaces__workspace_id__jobs__job_id__patch
      parameters:
      - in: path
        name: job_id
        required: true
        schema:
          format: uuid
          title: Job Id
          type: string
      - description: Type the id of the workspace.
        in: path
        name: workspace_id
        required: true
        schema:
          description: Type the id of the workspace.
          format: uuid
          title: Workspace Id
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateJob'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - HTTPBearer: []
      summary: Update Job
      tags:
      - Jobs
      x-deepset-permissions:
        action: write
        asset: jobs
        asset_description: Access to jobs details
        type: workspace
  /api/v2/workspaces/{workspace_id}/jobs/{job_id}/results:
    get:
      description: 'Returns job results.


        In addition to the job result''s own fields, ''select'' also accepts ''query_id'' and ''result_id'' —

        values extracted from the underlying pipeline response for the result''s first answer. These aren''t

        real columns: they''re only available through ''select'', not on a full (unselected) response, and they

        can be ''null'' if the query failed or produced no answer.'
      operationId: list_job_results_api_v2_workspaces__workspace_id__jobs__job_id__results_get
      parameters:
      - in: path
        name: job_id
        required: true
        schema:
          format: uuid
          title: Job Id
          type: string
      - description: Type the id of the workspace.
        in: path
        name: workspace_id
        required: true
        schema:
          description: Type the id of the workspace.
          format: uuid
          title: Workspace Id
          type: string
      - description: The number of entries to display. Leaving this field empty keeps the default, and max 10 results are returned.
        in: query
        name: limit
        required: false
        schema:
          default: 10
          description: The number of entries to display. Leaving this field empty keeps the default, and max 10 results are returned.
          maximum: 100
          title: Limit
          type: integer
      - description: Enter an ID if you want to see all entries before this ID. To use this option, clear the `page_number` parameter first.
        in: query
        name: before
        required: false
        schema:
          anyOf:
          - format: uuid
            type: string
          - type: 'null'
          description: Enter an ID if you want to see all entries before this ID. To use this option, clear the `page_number` parameter first.
          title: Before
      - description: Enter an ID if you want to see all entries after this ID. To use this option, clear the `page_number` parameter first.
        in: query
        name: after
        required: false
        schema:
          anyOf:
          - format: uuid
            type: string
          - type: 'null'
          description: Enter an ID if you want to see all entries after this ID. To use this option, clear the `page_number` parameter first.
          title: After
      - description: The number of the page you want to see.
        in: query
        name: page_number
        required: false
        schema:
          anyOf:
          - minimum: 1
            type: integer
          - type: 'null'
          description: The number of the page you want to see.
          title: Page Number
      - description: The name of the entity you want to sort by.<br/><br/>Supported values:<ul><li>`absolute_query_index`</li><li>`answer`</li><li>`context`</li><li>`created_at`</li><li>`file`</li><li>`group_name`</li><li>`prompt`</li><li>`query`</li><li>`query_index`</li><li>`query_label`</li></ul>
        in: query
        name: field
        required: false
        schema:
          default: query_index
          description: The name of the entity you want to sort by.<br/><br/>Supported values:<ul><li>`absolute_query_index`</li><li>`answer`</li><li>`context`</li><li>`created_at`</li><li>`file`</li><li>`group_name`</li><li>`prompt`</li><li>`query`</li><li>`query_index`</li><li>`query_label`</li></ul>
          enum:
          - query
          - answer
          - prompt
          - context
          - file
          - group_name
          - query_label
          - created_at
          - query_index
          - absolute_query_index
          title: Field
          type: string
      - description: Choose how you want to sort the results.
        in: query
        name: order
        required: false
        schema:
          default: ASC
          description: Choose how you want to sort the results.
          enum:
          - ASC
          - DESC
          title: Order
          type: string
      - description: 'Partial implementation of the OData $select operator. It currently only supports selecting fields from the root entity or a child entity. Selecting fields from children''s children is not supported. If you use this parameter, the API answer is always a flat list of distinct JSON objects with the selected properties, for example, ''[{"given_name": "user1", "user_id": "..."}, ...]'' for ''select=created_by/given_name, created_by/user_id''. The results are ordered by the first selected attribute. To learn more about the OData filter syntax, see: [Querying Data](https://www.odata.org/getting-started/basic-tutorial/#queryData).'
        in: query
        name: select
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: 'Partial implementation of the OData $select operator. It currently only supports selecting fields from the root entity or a child entity. Selecting fields from children''s children is not supported. If you use this parameter, the API answer is always a flat list of distinct JSON objects with the selected properties, for example, ''[{"given_name": "user1", "user_id": "..."}, ...]'' for ''select=created_by/given_name, created_by/user_id''. The results are ordered by the first selected attribute. To learn more about the OData filter syntax, see: [Querying Data](https://www.odata.org/getting-started/basic-tutorial/#queryData).'
          title: Select
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedJobResults'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - HTTPBearer: []
      summary: List Job Results
      tags:
      - Jobs
      x-deepset-permissions:
        action: read
        asset: jobs
        asset_description: Access to jobs details
        type: workspace
  /api/v2/workspaces/{workspace_id}/jobs/{job_id}/results/export:
    get:
      description: Download all of the job's results as a CSV file.
      operationId: export_job_results_api_v2_workspaces__workspace_id__jobs__job_id__results_export_get
      parameters:
      - in: path
        name: job_id
        required: true
        schema:
          format: uuid
          title: Job Id
          type: string
      - description: Type the id of the workspace.
        in: path
        name: workspace_id
        required: true
        schema:
          description: Type the id of the workspace.
          format: uuid
          title: Workspace Id
          type: string
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - HTTPBearer: []
      summary: Export Job Results
      tags:
      - Jobs
      x-deepset-permissions:
        action: read
        asset: jobs
        asset_description: Access to jobs details
        type: workspace
  /api/v2/workspaces/{workspace_id}/jobs/{job_id}/results/presigned-url:
    get:
      description: Upload the job's results as a CSV to S3 and return a time-limited presigned URL to download it.
      operationId: get_job_results_presigned_url_api_v2_workspaces__workspace_id__jobs__job_id__results_presigned_url_get
      parameters:
      - in: path
        name: job_id
        required: true
        schema:
          format: uuid
          title: Job Id
          type: string
      - description: Type the id of the workspace.
        in: path
        name: workspace_id
        required: true
        schema:
          description: Type the id of the workspace.
          format: uuid
          title: Workspace Id
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PresignedUrlResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - HTTPBearer: []
      summary: Get Job Results Presigned Url
      tags:
      - Jobs
      x-deepset-permissions:
        action: read
        asset: jobs
        asset_description: Access to jobs details
        type: workspace
  /api/v2/workspaces/{workspace_id}/jobs/{job_id}/start:
    post:
      description: 'Enqueue the job for execution.


        To be notified when the job finishes, pass one or more `callbacks`. deepset sends a POST request to each callback URL with the JSON body `{"job_id": "", "status": ""}`. `status` is `ENDED` if the job completed and `FAILED` if it did not, so you receive exactly one of the two. Any `headers` you supply are sent with the request.


        Each callback is sent once, with a 10-second timeout and no retries, and the response code is not checked. Treat the callback as a notification and call `GET /workspaces/{workspace_id}/jobs/{job_id}` when you need the authoritative job status.


        Returns 409 if the job is already STARTED; pass ''?force=true'' to re-enqueue a stuck job without losing progress already made.'
      operationId: start_job_api_v2_workspaces__workspace_id__jobs__job_id__start_post
      parameters:
      - in: path
        name: job_id
        required: true
        schema:
          format: uuid
          title: Job Id
          type: string
      - description: Type the id of the workspace.
        in: path
        name: workspace_id
        required: true
        schema:
          description: Type the id of the workspace.
          format: uuid
          title: Workspace Id
          type: string
      - description: Re-enqueue a job stuck in STARTED state
        in: query
        name: force
        required: false
        schema:
          default: false
          description: Re-enqueue a job stuck in STARTED state
          title: Force
          type: boolean
      requestBody:
        content:
          application/json:
            schema:
              anyOf:
              - $ref: '#/components/schemas/StartJobBody'
              - type: 'null'
              title: Body
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - HTTPBearer: []
      summary: Start Job
      tags:
      - Jobs
      x-deepset-permissions:
        action: write
        asset: jobs
        asset_description: Access to jobs details
        type: workspace
  /api/v2/workspaces/{workspace_id}/query_sets:
    get:
      description: List query sets in this workspace, most recently created first.
      operationId: list_query_sets_api_v2_workspaces__workspace_id__query_sets_get
      parameters:
      - description: Type the id of the workspace.
        in: path
        name: workspace_id
        required: true
        schema:
          description: Type the id of the workspace.
          format: uuid
          title: Workspace Id
          type: string
      - in: query
        name: page
        required: false
        schema:
          default: 1
          minimum: 1
          title: Page
          type: integer
      - in: query
        name: limit
        required: false
        schema:
          default: 10
          maximum: 100
          minimum: 1
          title: Limit
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedQuerySets'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - HTTPBearer: []
      summary: List Query Sets
      tags:
      - Jobs
      x-deepset-permissions:
        action: read
        asset: jobs
        asset_description: Access to jobs details
        type: workspace
  /api/v2/workspaces/{workspace_id}/query_sets/import:
    post:
      description: 'Create a query set from an uploaded CSV file. Expected columns: ''query'' (required), ''filters'', ''params'', ''group name'', ''query label''. Returns 409 if a query set with the given name already exists.'
      operationId: import_query_set_api_v2_workspaces__workspace_id__query_sets_import_post
      parameters:
      - description: Type the id of the workspace.
        in: path
        name: workspace_id
        required: true
        schema:
          description: Type the id of the workspace.
