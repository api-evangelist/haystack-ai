openapi: 3.2.0
info:
  description: deepset API description
  title: Haystack Enterprise Platform Indexes API
  version: 1.0.0
servers:
- description: deepset Europe
  url: https://api.cloud.deepset.ai
- description: deepset US
  url: https://api.us.deepset.ai
tags:
- name: indexes
paths:
  /api/v1/workspaces/{workspace_name}/indexes:
    get:
      operationId: get_indexes_api_v1_workspaces__workspace_name__indexes_get
      parameters:
      - description: Type the name of the workspace.
        in: path
        name: workspace_name
        required: true
        schema:
          description: Type the name of the workspace.
          title: Workspace Name
          type: string
      - description: The number of entries to display. Leaving this field empty keeps the default, and max 10 results are returned.
        in: query
        name: limit
        required: false
        schema:
          default: 10
          description: The number of entries to display. Leaving this field empty keeps the default, and max 10 results are returned.
          maximum: 100
          title: Limit
          type: integer
      - description: Enter an ID if you want to see all entries before this ID. To use this option, clear the `page_number` parameter first.
        in: query
        name: before
        required: false
        schema:
          anyOf:
          - format: uuid
            type: string
          - type: 'null'
          description: Enter an ID if you want to see all entries before this ID. To use this option, clear the `page_number` parameter first.
          title: Before
      - description: Enter an ID if you want to see all entries after this ID. To use this option, clear the `page_number` parameter first.
        in: query
        name: after
        required: false
        schema:
          anyOf:
          - format: uuid
            type: string
          - type: 'null'
          description: Enter an ID if you want to see all entries after this ID. To use this option, clear the `page_number` parameter first.
          title: After
      - description: The number of the page you want to see.
        in: query
        name: page_number
        required: false
        schema:
          anyOf:
          - minimum: 1
            type: integer
          - type: 'null'
          description: The number of the page you want to see.
          title: Page Number
      - description: The name of the entity you want to sort by.<br/><br/>Supported values:<ul><li>`created_at`</li><li>`created_by/family_name`</li><li>`created_by/given_name`</li><li>`created_by/user_id`</li><li>`name`</li></ul>
        in: query
        name: field
        required: false
        schema:
          default: created_at
          description: The name of the entity you want to sort by.<br/><br/>Supported values:<ul><li>`created_at`</li><li>`created_by/family_name`</li><li>`created_by/given_name`</li><li>`created_by/user_id`</li><li>`name`</li></ul>
          enum:
          - name
          - created_at
          - created_by/user_id
          - created_by/given_name
          - created_by/family_name
          title: Field
          type: string
      - description: Choose how you want to sort the results.
        in: query
        name: order
        required: false
        schema:
          default: DESC
          description: Choose how you want to sort the results.
          enum:
          - ASC
          - DESC
          title: Order
          type: string
      - description: 'Partial implementation of the OData $select operator. It currently only supports selecting fields from the root entity or a child entity. Selecting fields from children''s children is not supported. If you use this parameter, the API answer is always a flat list of distinct JSON objects with the selected properties, for example, ''[{"given_name": "user1", "user_id": "..."}, ...]'' for ''select=created_by/given_name, created_by/user_id''. The results are ordered by the first selected attribute. To learn more about the OData filter syntax, see: [Querying Data](https://www.odata.org/getting-started/basic-tutorial/#queryData).'
        in: query
        name: select
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: 'Partial implementation of the OData $select operator. It currently only supports selecting fields from the root entity or a child entity. Selecting fields from children''s children is not supported. If you use this parameter, the API answer is always a flat list of distinct JSON objects with the selected properties, for example, ''[{"given_name": "user1", "user_id": "..."}, ...]'' for ''select=created_by/given_name, created_by/user_id''. The results are ordered by the first selected attribute. To learn more about the OData filter syntax, see: [Querying Data](https://www.odata.org/getting-started/basic-tutorial/#queryData).'
          title: Select
      - description: 'The OData filter you want to use to in your query. It supports exact match and `AND` operations. For example, to filter for a metadata `category:news` and `published_date` greater than or equal to January 1 2025, here''s what the URL could look like: ''url = "https://api.cloud.deepset.ai/api/v1/workspaces/production/files?limit=10&filter=category eq ''news'' and published_date ge ''2025-01-01'' "''. OData filters only work with cursor-based pagination (leave the `page_number` field blank to enable it).To learn more about the OData filter syntax, see: [Querying Data](https://www.odata.org/getting-started/basic-tutorial/#queryData).'
        in: query
        name: filter
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: 'The OData filter you want to use to in your query. It supports exact match and `AND` operations. For example, to filter for a metadata `category:news` and `published_date` greater than or equal to January 1 2025, here''s what the URL could look like: ''url = "https://api.cloud.deepset.ai/api/v1/workspaces/production/files?limit=10&filter=category eq ''news'' and published_date ge ''2025-01-01'' "''. OData filters only work with cursor-based pagination (leave the `page_number` field blank to enable it).To learn more about the OData filter syntax, see: [Querying Data](https://www.odata.org/getting-started/basic-tutorial/#queryData).'
          title: Filter
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedResult_PipelineIndex_'
          description: Successful Response
        '404':
          description: Workspace not found
        '422':
          description: Invalid filter expression
      security:
      - HTTPBearer: []
      summary: Get Indexes
      tags:
      - indexes
      x-deepset-permissions:
        action: read
        asset: indexes
        asset_description: Access to index details
        type: workspace
    post:
      description: Creates a new pipeline index.
      operationId: create_index_api_v1_workspaces__workspace_name__indexes_post
      parameters:
      - description: Type the name of the workspace.
        in: path
        name: workspace_name
        required: true
        schema:
          description: Type the name of the workspace.
          title: Workspace Name
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePipelineIndexRequest'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PipelineIndex'
          description: Successful Response
        '402':
          description: You've reached the maximum number of indexes for your organization. Delete an existing index to create a new one.
        '409':
          description: An index with this name already exists in your workspace. Choose a unique name for your index.
        '422':
          description: Invalid request body or invalid index configuration.
      security:
      - HTTPBearer: []
      summary: Create Index
      tags:
      - indexes
      x-deepset-permissions:
        action: write
        asset: indexes
        asset_description: Access to index details
        type: workspace
  /api/v1/workspaces/{workspace_name}/indexes/{index_name}:
    delete:
      description: Deletes a pipeline index.
      operationId: delete_index_api_v1_workspaces__workspace_name__indexes__index_name__delete
      parameters:
      - description: Type the name of the workspace.
        in: path
        name: workspace_name
        required: true
        schema:
          description: Type the name of the workspace.
          title: Workspace Name
          type: string
      - description: Name of the pipeline index.
        in: path
        name: index_name
        required: true
        schema:
          description: Name of the pipeline index.
          title: Index Name
          type: string
      - description: Delete the index even if pipelines still use it.
        in: query
        name: force
        required: false
        schema:
          default: false
          description: Delete the index even if pipelines still use it.
          title: Force
          type: boolean
      responses:
        '204':
          description: Successful Response
        '400':
          description: The pipeline index is linked to a pipeline and cannot be deleted. Unlink the index from pipelines first.
        '404':
          description: The index was not found in the workspace.
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - HTTPBearer: []
      summary: Delete Index
      tags:
      - indexes
      x-deepset-permissions:
        action: write
        asset: indexes
        asset_description: Access to index details
        type: workspace
    get:
      description: Get a single pipeline index by ID.
      operationId: get_index_by_name_api_v1_workspaces__workspace_name__indexes__index_name__get
      parameters:
      - description: Type the name of the workspace.
        in: path
        name: workspace_name
        required: true
        schema:
          description: Type the name of the workspace.
          title: Workspace Name
          type: string
      - description: The name of the pipeline index used to process the documents.
        in: path
        name: index_name
        required: true
        schema:
          description: The name of the pipeline index used to process the documents.
          title: Index Name
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PipelineIndex'
          description: Successful Response
        '404':
          description: Index or workspace not found
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - HTTPBearer: []
      summary: Get Index By Name
      tags:
      - indexes
      x-deepset-permissions:
        action: read
        asset: indexes
        asset_description: Access to index details
        type: workspace
    patch:
      description: 'Updates specific fields of a pipeline index. Only description can be updated while the index is deployed.

        To update name or config_yaml, the index must be undeployed.'
      operationId: update_index_api_v1_workspaces__workspace_name__indexes__index_name__patch
      parameters:
      - description: Type the name of the workspace.
        in: path
        name: workspace_name
        required: true
        schema:
          description: Type the name of the workspace.
          title: Workspace Name
          type: string
      - description: Name of the pipeline index.
        in: path
        name: index_name
        required: true
        schema:
          description: Name of the pipeline index.
          title: Index Name
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePipelineIndexRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PipelineIndex'
          description: Successful Response
        '404':
          description: Index or workspace not found
        '409':
          description: Cannot update 'name' or 'config_yaml' of a deployed pipeline index, or the index name already exists.
        '422':
          description: Invalid request body or invalid index configuration.
      security:
      - HTTPBearer: []
      summary: Update Index
      tags:
      - indexes
      x-deepset-permissions:
        action: write
        asset: indexes
        asset_description: Access to index details
        type: workspace
  /api/v1/workspaces/{workspace_name}/indexes/{index_name}/deploy:
    post:
      description: Deploys a pipeline index to deepset.
      operationId: deploy_index_api_v1_workspaces__workspace_name__indexes__index_name__deploy_post
      parameters:
      - description: Type the name of the workspace.
        in: path
        name: workspace_name
        required: true
        schema:
          description: Type the name of the workspace.
          title: Workspace Name
          type: string
      - description: Name of the pipeline index.
        in: path
        name: index_name
        required: true
        schema:
          description: Name of the pipeline index.
          title: Index Name
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PipelineIndex'
          description: Successful Response
        '400':
          description: Enabling the pipeline index failed because the pipeline index is not valid. Check the index configuration or choose a valid index.
        '404':
          description: The index was not found in the workspace.
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
        '424':
          description: 'The model referenced in the pipeline index was not found, so the index was not created. Ensure the model exists. '
      security:
      - HTTPBearer: []
      summary: Deploy Index
      tags:
      - indexes
      x-deepset-permissions:
        action: write
        asset: indexes
        asset_description: Access to index details
        type: workspace
  /api/v1/workspaces/{workspace_name}/indexes/{index_name}/documents-count:
    get:
      description: Counts the number of documents in the pipeline.
      operationId: count_documents_api_v1_workspaces__workspace_name__indexes__index_name__documents_count_get
      parameters:
      - description: The name of the pipeline.
        in: path
        name: index_name
        required: true
        schema:
          description: The name of the pipeline.
          title: Index Name
          type: string
      - description: Type the name of the workspace.
        in: path
        name: workspace_name
        required: true
        schema:
          description: Type the name of the workspace.
          title: Workspace Name
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DCDocumentCount'
          description: Documents retrieved successfully.
        '404':
          description: The index was not found in the workspace.
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - HTTPBearer: []
      summary: Count Documents
      tags:
      - indexes
      x-deepset-permissions:
        action: read
        asset: indexes
        asset_description: Access to index details
        type: workspace
  /api/v1/workspaces/{workspace_name}/indexes/{index_name}/documents-query:
    post:
      description: Searches the documents for the specified query.
      operationId: query_documents_api_v1_workspaces__workspace_name__indexes__index_name__documents_query_post
      parameters:
      - description: The name of the pipeline.
        in: path
        name: index_name
        required: true
        schema:
          description: The name of the pipeline.
          title: Index Name
          type: string
      - description: Type the name of the workspace.
        in: path
        name: workspace_name
        required: true
        schema:
          description: Type the name of the workspace.
          title: Workspace Name
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QueryDocumentsParams'
              description: Retrieval parameters for the pipeline index.
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/RawHaystackDocument'
                title: Response 200 Query Documents Api V1 Workspaces  Workspace Name  Indexes  Index Name  Documents Query Post
                type: array
          description: Documents retrieved successfully.
        '400':
          description: Invalid query parameters.
        '404':
          description: The index was not found in the workspace.
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - HTTPBearer: []
      summary: Query Documents
      tags:
      - indexes
      x-deepset-permissions:
        action: read
        asset: indexes
        asset_description: Access to index details
        type: workspace
  /api/v1/workspaces/{workspace_name}/indexes/{index_name}/documents-stream:
    post:
      description: 'Returns documents created for a pipeline.


        Without pagination parameters, all documents are streamed. To paginate, pass `page_number`

        (1-indexed) together with `limit` in the request body. Paginated responses include

        `X-Total-Count` and `X-Has-More` response headers.'
      operationId: get_all_documents_stream_api_v1_workspaces__workspace_name__indexes__index_name__documents_stream_post
      parameters:
      - description: The name of the pipeline.
        in: path
        name: index_name
        required: true
        schema:
          description: The name of the pipeline.
          title: Index Name
          type: string
      - description: Type the name of the workspace.
        in: path
        name: workspace_name
        required: true
        schema:
          description: Type the name of the workspace.
          title: Workspace Name
          type: string
      - in: header
        name: accept
        required: false
        schema:
          default: application/json
          title: Accept
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FetchDocumentsParams'
              description: Retrieval parameters for the pipeline index.
        required: true
      responses:
        '200':
          description: Successful Response
        '404':
          description: The index was not found in the workspace.
        '406':
          description: 'The server cannot produce a response matching the request. Requested format: your-accept-header'
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - HTTPBearer: []
      summary: Get All Documents Stream
      tags:
      - indexes
      x-deepset-permissions:
        action: read
        asset: indexes
        asset_description: Access to index details
        type: workspace
  /api/v1/workspaces/{workspace_name}/indexes/{index_name}/documents/{document_id}:
    get:
      description: Displays the document content and its properties.
      operationId: get_document_api_v1_workspaces__workspace_name__indexes__index_name__documents__document_id__get
      parameters:
      - description: The identifier of the document. To obtain the ID, you can call the Get All Documents endpoint.
        in: path
        name: document_id
        required: true
        schema:
          description: The identifier of the document. To obtain the ID, you can call the Get All Documents endpoint.
          title: Document Id
          type: string
      - description: The name of the pipeline.
        in: path
        name: index_name
        required: true
        schema:
          description: The name of the pipeline.
          title: Index Name
          type: string
      - description: Type the name of the workspace.
        in: path
        name: workspace_name
        required: true
        schema:
          description: Type the name of the workspace.
          title: Workspace Name
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RawHaystackDocument'
          description: Documents retrieved successfully.
        '404':
          description: 'Document ''{document_id}'' doesn''t exist in index ''{index_name}''. '
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - HTTPBearer: []
      summary: Get Document
      tags:
      - indexes
      x-deepset-permissions:
        action: read
        asset: indexes
        asset_description: Access to index details
        type: workspace
  /api/v1/workspaces/{workspace_name}/indexes/{index_name}/files:
    get:
      description: Returns IDs of all files with a specific status and processed by a specified index.
      operationId: get_indexed_files_by_status_api_v1_workspaces__workspace_name__indexes__index_name__files_get
      parameters:
      - description: Name of the pipeline index.
        in: path
        name: index_name
        required: true
        schema:
          description: Name of the pipeline index.
          title: Index Name
          type: string
      - description: Type the name of the workspace.
        in: path
        name: workspace_name
        required: true
        schema:
          description: Type the name of the workspace.
          title: Workspace Name
          type: string
      - description: The indexing status of the files you want to display.
        in: query
        name: status
        required: false
        schema:
          $ref: '#/components/schemas/FileStatus'
          default: FAILED
          description: The indexing status of the files you want to display.
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  format: uuid
                  type: string
                title: Response Get Indexed Files By Status Api V1 Workspaces  Workspace Name  Indexes  Index Name  Files Get
                type: array
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - HTTPBearer: []
      summary: Get Indexed Files By Status
      tags:
      - indexes
      x-deepset-permissions:
        action: read
        asset: indexes
        asset_description: Access to index details
        type: workspace
  /api/v1/workspaces/{workspace_name}/indexes/{index_name}/files/{file_id}/reindex:
    post:
      description: 'Reindexes a single file on a pipeline index.


        Set `capture_trace` to `true` to record an indexing trace of the run. The trace covers the whole batch the file is

        indexed in: when the queue is busy, it also shows other files from that batch. Each file in the trace has its own

        `capture_trace` value, so you can tell which file you requested.'
      operationId: schedule_single_file_for_indexing_api_v1_workspaces__workspace_name__indexes__index_name__files__file_id__reindex_post
      parameters:
      - description: Name of the pipeline index.
        in: path
        name: index_name
        required: true
        schema:
          description: Name of the pipeline index.
          title: Index Name
          type: string
      - description: Unique identifier of a file.
        in: path
        name: file_id
        required: true
        schema:
          description: Unique identifier of a file.
          format: uuid
          title: File Id
          type: string
      - description: Type the name of the workspace.
        in: path
        name: workspace_name
        required: true
        schema:
          description: Type the name of the workspace.
          title: Workspace Name
          type: string
      - description: 'Record an indexing trace for this file''s run: how it was converted and split. The trace shows up under the index''s traces.'
        in: query
        name: capture_trace
        required: false
        schema:
          default: false
          description: 'Record an indexing trace for this file''s run: how it was converted and split. The trace shows up under the index''s traces.'
          title: Capture Trace
          type: boolean
      responses:
        '204':
          description: Successful Response
        '400':
          description: The pipeline index is not enabled.
        '404':
          description: The index was not found in the workspace.
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - HTTPBearer: []
      summary: Schedule Single File For Indexing
      tags:
      - indexes
      x-deepset-permissions:
        action: write
        asset: indexes
        asset_description: Access to index details
        type: workspace
  /api/v1/workspaces/{workspace_name}/indexes/{index_name}/logs:
    get:
      description: Fetches pipeline index logs as JSON or CSV.
      operationId: get_pipeline_index_logs_api_v1_workspaces__workspace_name__indexes__index_name__logs_get
      parameters:
      - description: Type the name of the workspace.
        in: path
        name: workspace_name
        required: true
        schema:
          description: Type the name of the workspace.
          title: Workspace Name
          type: string
      - description: The name of the pipeline index used to process the documents.
        in: path
        name: index_name
        required: true
        schema:
          description: The name of the pipeline index used to process the documents.
          title: Index Name
          type: string
      - description: 'The OData filter you want to use to in your query. It supports exact match and `AND` operations. For example, to filter for a metadata `category:news` and `published_date` greater than or equal to January 1 2025, here''s what the URL could look like: ''url = "https://api.cloud.deepset.ai/api/v1/workspaces/production/files?limit=10&filter=category eq ''news'' and published_date ge ''2025-01-01'' "''. OData filters only work with cursor-based pagination (leave the `page_number` field blank to enable it).To learn more about the OData filter syntax, see: [Querying Data](https://www.odata.org/getting-started/basic-tutorial/#queryData).'
        in: query
        name: filter
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: 'The OData filter you want to use to in your query. It supports exact match and `AND` operations. For example, to filter for a metadata `category:news` and `published_date` greater than or equal to January 1 2025, here''s what the URL could look like: ''url = "https://api.cloud.deepset.ai/api/v1/workspaces/production/files?limit=10&filter=category eq ''news'' and published_date ge ''2025-01-01'' "''. OData filters only work with cursor-based pagination (leave the `page_number` field blank to enable it).To learn more about the OData filter syntax, see: [Querying Data](https://www.odata.org/getting-started/basic-tutorial/#queryData).'
          title: Filter
      - in: query
        name: limit
        required: false
        schema:
          default: 10
          maximum: 100
          title: Limit
          type: integer
      - in: query
        name: after
        required: false
        schema:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: After
      - in: query
        name: order
        required: false
        schema:
          $ref: '#/components/schemas/SortingOrderEnum'
          default: DESC
      - description: 'The format of the index logs. Supported formats: text/csv, application/json'
        in: header
        name: accept
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
