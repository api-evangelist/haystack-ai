    ChatStreamingQuery:
      description: Request body for the pipeline-scoped `/chat-stream` endpoint.
      examples:
      - chat_history_limit: 3
        debug: true
        filters:
          conditions:
          - field: meta.country
            operator: ==
            value: France
          - field: meta.date
            operator: '>='
            value: '2025-01-01'
          - conditions:
            - field: meta.city
              operator: ==
              value: Paris
            - field: meta.name
              operator: in
              value:
              - Paris
              - Lyon
            operator: OR
          operator: AND
        include_result: false
        params:
          retriever:
            top_k: 2
        query: What is the capital of France?
        search_session_id: 123e4567-e89b-12d3-a456-426614174000
        view_prompts: false
      properties:
        chat_history_granularity:
          anyOf:
          - $ref: '#/components/schemas/ChatHistoryGranularity'
          - type: 'null'
          description: Controls how much of the chat history is replayed to the pipeline. Use `all_messages` to include every message (tool calls, reasoning, etc.) from the last turns, or `query_answer` (default) to include only the user query and the final answer from each turn. Can also be set per-pipeline in the pipeline YAML under `history.granularity`.
          title: Chat History Granularity
        chat_history_limit:
          default: 3
          description: The number of the most recent chat history items to include in the chat. For example, setting the limit to 3 will show the last three
          title: Chat History Limit
          type: integer
        debug:
          anyOf:
          - type: boolean
          - type: 'null'
          default: false
          description: Shows debug output for the pipeline or deployed service (for example, prompt).
          title: Debug Flag
        files:
          anyOf:
          - items:
              format: uuid
              type: string
            type: array
          - type: 'null'
          description: A list of files in the workspace.
          title: Files
        filters:
          anyOf:
          - $ref: '#/components/schemas/LogicalCondition'
          - $ref: '#/components/schemas/ComparisonCondition'
          - $ref: '#/components/schemas/EmptyFilters'
          - type: 'null'
          description: Filters you can use to narrow down the search. For more information, see [filtering logic](https://docs.cloud.deepset.ai/docs/filtering-logic).
          title: Haystack Filters
        include_reasoning:
          default: false
          description: 'Includes the reasoning output under key ''reasoning'' when set to `true`. Defaults to `false`.

            The reasoning output may include the intermediate steps taken by the model to arrive at the final answer. Example reasoning output:

            ```json

            {"query_id": "e2084408-48f8-4f52-9b59-43dd924705ef", "type": "reasoning", "reasoning": {"reasoning_text": "This is the plan:\nStep 1: Retrieve documents\nStep 2: Process documents\nStep 3: Generate answer", "extra": {}}}

            ```'
          title: Include Reasoning
          type: boolean
        include_result:
          default: false
          description: Includes the result of the pipeline or deploed service at the end of the stream under key 'result'.
          title: Include Result
          type: boolean
        include_tool_call_results:
          default: false
          description: 'Includes the tool call results under key ''tool_call_result'' when set to `true`. Defaults to `false`.

            Example tool call result event:

            ```json

            {"query_id": "e2084408-48f8-4f52-9b59-43dd924705ef", "type": "tool_call_result", "tool_call_result": {"origin": {"tool_name": "example_tool", "arguments": {"arg1": "val1"}, "index": 0}, "result": "This is an example result.", "error": false}}

            ```'
          title: Include Tool Call Results
          type: boolean
        include_tool_calls:
          anyOf:
          - type: boolean
          - const: rendered
            type: string
          default: rendered
          description: 'Includes tool calls as tool call delta objects under key ''tool_call_delta'' when set to `true`. When set to `rendered`, tool call events are rendered as markdown text instead. This parameter only affects the stream (not the final result) and is only effective when the pipeline or deployed service makes tool calls (e.g. using the Agent component). Defaults to `rendered`.

            Example tool call delta events:

            ```json

            {"query_id": "e2084408-48f8-4f52-9b59-43dd924705ef", "type": "tool_call_delta", "tool_call_delta": {"tool_name": "example_tool", "index": 0, "id": "tool_call_01"}}

            {"query_id": "e2084408-48f8-4f52-9b59-43dd924705ef", "type": "tool_call_delta", "tool_call_delta": {"arguments": "{\"arg1\": ", "index": 0}}

            {"query_id": "e2084408-48f8-4f52-9b59-43dd924705ef", "type": "tool_call_delta", "tool_call_delta": {"arguments": "\"val1\"}", "index": 0}}

            ```'
          title: Include Tool Calls
        params:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          description: 'Parameters you can use to customize the pipeline or deployed service. For details, see [Haystack documentation for the pipeline `run()` method](https://docs.haystack.deepset.ai/reference/pipeline-api). These filters can be used to pass additional parameters to the pipeline.(Haystack is the underlying technology for deepset.) '
          title: Pipeline Parameters
        pipeline_version_id:
          anyOf:
          - format: uuid
            type: string
          - type: 'null'
          description: The pipeline version ID to use for serverless execution. Only valid when serverless is True. If not provided, the pipeline's default version is used.
          title: Pipeline Version Id
        query:
          description: The search query.
          title: Query
          type: string
        search_session_id:
          anyOf:
          - format: uuid
            type: string
          - type: 'null'
          description: 'The ID of the search session to use for chat history. Optional: if omitted, a new search session owned by the pipeline you''re querying is created automatically and its ID is returned in the `X-Search-Session-Id` response header.'
          title: Search Session ID
        serverless:
          default: false
          description: If True, run the pipeline via utilities without requiring deployment.
          title: Serverless
          type: boolean
        store_search_history:
          default: true
          description: If False, the query and response are not persisted to the chat history for the given search_session_id. Currently only honored in serverless mode.
          title: Store Search History
          type: boolean
        view_prompts:
          default: false
          description: Adds the runtime prompts of all nodes to the response. (The pipeline or deployed service runs in debug mode.)
          title: View prompts
          type: boolean
      required:
      - query
      title: ChatStreamingQuery
      type: object
