components:
  schemas:
    QueryPipelineVersionPatchRequest:
      properties:
        config_yaml:
          anyOf:
          - type: string
          - type: 'null'
          description: The deepset pipeline YAML configuration for querying.
          title: Query YAML
        description:
          anyOf:
          - type: string
          - type: 'null'
          description: The description of the pipeline version.
          title: Description
        is_default:
          anyOf:
          - type: boolean
          - type: 'null'
          description: Whether this is the default version for the pipeline. Only non-draft versions can be set as default. Setting a version as default automatically unsets the previous default.
          title: Is Default
        is_draft:
          anyOf:
          - type: boolean
          - type: 'null'
          description: Whether the pipeline version is a draft.
          title: Is Draft
        pipeline_visualization_metadata:
          anyOf:
          - $ref: '#/components/schemas/PipelineVisualizationMetadata'
          - type: 'null'
          description: Component names and their visualizations.
          title: Components
      title: QueryPipelineVersionPatchRequest
      type: object
    HaystackTraceSpan:
      properties:
        component:
          anyOf:
          - type: string
          - type: 'null'
          title: Component
        duration_ms:
          anyOf:
          - type: number
          - type: 'null'
          title: Duration Ms
        end_time:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: End Time
        operation_name:
          title: Operation Name
          type: string
        parent_span_id:
          anyOf:
          - format: uuid
            type: string
          - type: 'null'
          title: Parent Span Id
        span_id:
          format: uuid
          title: Span Id
          type: string
        start_time:
          format: date-time
          title: Start Time
          type: string
        tags:
          additionalProperties: true
          title: Tags
          type: object
      required:
      - span_id
      - operation_name
      - start_time
      title: HaystackTraceSpan
      type: object
    PipelineYAMLConfiguration:
      properties:
        deepset_cloud_version:
          $ref: '#/components/schemas/DeepsetCloudVersion'
          description: The version of deepset the pipeline was created with.
          title: deepset Version
        query_yaml:
          anyOf:
          - type: string
          - type: 'null'
          description: The deepset pipeline YAML configuration for querying.
          title: Query YAML
      required:
      - query_yaml
      - deepset_cloud_version
      title: PipelineYAMLConfiguration
      type: object
    PipelineServiceLevelWithDraftEnum:
      enum:
      - DRAFT
      - DEVELOPMENT
      - PRODUCTION
      title: PipelineServiceLevelWithDraftEnum
      type: string
    HaystackTraceV1:
      properties:
        duration_ms:
          anyOf:
          - type: number
          - type: 'null'
          title: Duration Ms
        failure:
          anyOf:
          - $ref: '#/components/schemas/HaystackTraceFailure'
          - type: 'null'
        finished_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Finished At
        logs:
          items:
            $ref: '#/components/schemas/HaystackTraceLog'
          title: Logs
          type: array
        run_id:
          format: uuid
          title: Run Id
          type: string
        schema_version:
          const: haystack-trace/v1
          title: Schema Version
          type: string
        started_at:
          format: date-time
          title: Started At
          type: string
        status:
          enum:
          - success
          - failed
          title: Status
          type: string
        traces:
          items:
            $ref: '#/components/schemas/HaystackTraceSpan'
          title: Traces
          type: array
      required:
      - schema_version
      - run_id
      - started_at
      - status
      - traces
      - logs
      title: HaystackTraceV1
      type: object
    PipelineOutputType:
      enum:
      - generative
      - extractive
      - document
      - unknown
      - chat
      title: PipelineOutputType
      type: string
