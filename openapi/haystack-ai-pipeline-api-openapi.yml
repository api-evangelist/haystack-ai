          title: Tool Call Result
          type: string
      required:
      - result
      - origin
      - error
      title: ToolCallResult
      type: object
    SearchStreamDeltaEventData:
      properties:
        delta:
          $ref: '#/components/schemas/SearchStreamDelta'
          description: The incremental update to the search results.
          title: Delta Data
        finish_reason:
          anyOf:
          - enum:
            - stop
            - length
            - tool_calls
            - content_filter
            - tool_call_results
            type: string
          - type: 'null'
          description: The reason why the content generation was finished.
          title: Finish Reason
        index:
          anyOf:
          - type: integer
          - type: 'null'
          description: The index of the content part to be updated.
          title: Delta Index
        query_id:
          description: The unique identifier for the search query.
          format: uuid
          title: Query ID
          type: string
        start:
          anyOf:
          - type: boolean
          - type: 'null'
          description: Indicates if this is the start of the content part.
          title: Start Flag
        type:
          const: delta
          description: Indicates that this event contains an incremental update to the search results.
          title: Event Type
          type: string
      required:
      - type
      - query_id
      - delta
      title: SearchStreamDeltaEventData
      type: object
    ToolCall:
      properties:
        arguments:
          additionalProperties: true
          description: The arguments to call the Tool with.
          title: Tool Arguments
          type: object
        id:
