  /api/v1/workspaces/{workspace_name}/pipelines/{pipeline_name}/chat-stream:
    post:
      description: 'Run a chat query against a pipeline, streaming the response as Server-Sent Events, using prior turns

        from a search session as chat history. Chat pipelines are based on the `chat` template that uses a search session to include conversation history

        in the chat. You can specify how many search history items (query and answer) from a given search session

        you want to display in the chat. You''ll need a search session ID to group queries into a conversation. If omitted, a new session is

        created automatically and returned in the `X-Search-Session-Id` response header for reuse in subsequent

        requests. Use the search session endpoints for pipelines to manage search sessions. Example request:

        ```json

        {

        "query": "How does streaming work with Haystack Enterprise Platform?",

        "search_session_id": "3fa85f64-5717-4562-b3fc-2c963f66afa6"

        }

        ```


        Options:

        - `search_session_id` groups queries into a conversation, allowing them to use previous queries and answers

        as chat history. If omitted, a new session is created automatically. Its ID is returned in the

        `X-Search-Session-Id` response header for reuse in subsequent requests. - The full result is included as the last stream message if `include_result=True`. - Tool calls are streamed if `include_tool_calls=True` (default `rendered`, converted to markdown text deltas). - Tool call results are streamed if `include_tool_call_results=True`. - Reasoning output is streamed if `include_reasoning=True`. Ping events are connection status, not answer text. `{"type":"ping"}` is a heartbeat, while

        `{"type":"ping","phase":"cold_start"}` tells you that temporary infrastructure and pipeline preparation is

        still running. You can ignore either form. After you receive a ping, later failures arrive as one terminal

        `error` event over the HTTP 200 stream and are not followed by `done`.'
      operationId: chat_stream_api_v1_workspaces__workspace_name__pipelines__pipeline_name__chat_stream_post
      parameters:
      - description: The name of the pipeline you want to use for search.
        in: path
        name: pipeline_name
        required: true
        schema:
          description: The name of the pipeline you want to use for search.
          title: Pipeline Name
          type: string
      - description: Type the name of the workspace.
        in: path
        name: workspace_name
        required: true
        schema:
          description: Type the name of the workspace.
          title: Workspace Name
          type: string
      - description: 'Set to `off` to suppress the `: keep-alive` comment lines that the stream sends while it waits for pipeline output. Set to `on` or omit the header to keep them.'
        in: header
        name: X-Deepset-Stream-Keepalive
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: 'Set to `off` to suppress the `: keep-alive` comment lines that the stream sends while it waits for pipeline output. Set to `on` or omit the header to keep them.'
          title: X-Deepset-Stream-Keepalive
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatStreamingQuery'
        required: true
      responses:
        '200':
          content:
            text/event-stream:
              schema:
                $ref: '#/components/schemas/SearchStream'
          description: Returns the search results.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultErrorResponse'
          description: The stream keep-alive header carries a value other than `on` or `off`. Correct the value and send the request again.
        '403':
          description: The shared prototype does not allow runtime parameters.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultErrorResponse'
          description: We couldn't find the pipeline. Check if the pipeline name is correct, make sure the pipeline exists in the workspace you specified, and try again.
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultErrorResponse'
          description: The pipeline was in a conflicted state (for example, it wasn't deployed).
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultErrorResponse'
          description: The rate limit for this pipeline has been exceeded. Please try again later.
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultErrorResponse'
          description: The pipeline is temporarily unavailable because of internal rebalancing processes. Try again in a few moments.
        '591':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultErrorResponse'
          description: The pipeline was on standby, and is now being activated. Try again in a while.
      security:
      - HTTPBearer: []
      summary: Chat Stream
      tags:
      - Pipeline
