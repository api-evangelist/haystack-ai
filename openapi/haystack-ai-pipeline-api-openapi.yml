            ```json

            {"query_id": "e2084408-48f8-4f52-9b59-43dd924705ef", "type": "tool_call_delta", "tool_call_delta": {"tool_name": "example_tool", "index": 0, "id": "tool_call_01"}}

            {"query_id": "e2084408-48f8-4f52-9b59-43dd924705ef", "type": "tool_call_delta", "tool_call_delta": {"arguments": "{\"arg1\": ", "index": 0}}

