          title: Indexing YAML
        name:
          description: Name of the pipeline.
          title: Pipeline Name
          type: string
        query_yaml:
          anyOf:
          - type: string
          - type: 'null'
          description: The deepset pipeline YAML configuration for querying.
          title: Query YAML
      required:
      - name
      title: CreatePipeline
      type: object
    SearchStreamToolCallEventData:
      properties:
        index:
          anyOf:
          - type: integer
          - type: 'null'
          description: The index of the content part to be updated.
          title: Delta Index
        query_id:
          description: The unique identifier for the search query.
          format: uuid
          title: Query ID
          type: string
        start:
          anyOf:
          - type: boolean
          - type: 'null'
          description: Indicates if this is the start of the content part.
          title: Start Flag
        tool_call_delta:
          $ref: '#/components/schemas/ToolCallDelta'
          description: Information about the tool call made during the search.
          title: Tool Call Delta
        type:
          const: tool_call_delta
          description: Indicates that this event contains tool call information.
          title: Event Type
          type: string
      required:
      - type
      - query_id
      - tool_call_delta
      title: SearchStreamToolCallEventData
      type: object
    SearchStreamErrorEventData:
      properties:
        _debug:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          description: Optional debug information related to the error.
          title: Debug Information
        error:
          description: A description of the error that occurred during the search.
          title: Error Message
          type: string
        error_category:
          anyOf:
          - $ref: '#/components/schemas/RunErrorCategory'
          - type: 'null'
          description: Classifies who is responsible for the error. `user_error` means the caller can fix it (for example, invalid input or a provider 4xx). `system_error` means the platform failed (for example, a pipeline fault or provider 5xx). `unknown` is the catch-all when the cause cannot be determined.
          title: Error Category
        query_id:
          description: The unique identifier for the search query.
          format: uuid
          title: Query ID
          type: string
        type:
          const: error
          description: Indicates that this event contains an error message.
          title: Event Type
          type: string
      required:
      - type
      - query_id
      - error
      title: SearchStreamErrorEventData
      type: object
    ToolCallResult:
      properties:
        error:
          description: Whether the Tool invocation resulted in an error.
          title: Tool Call Error
          type: boolean
        origin:
