openapi: 3.2.0
info:
  description: deepset API description
  title: Haystack Enterprise Platform Pipeline API
  version: 1.0.0
servers:
- description: deepset Europe
  url: https://api.cloud.deepset.ai
- description: deepset US
  url: https://api.us.deepset.ai
tags:
- name: Pipeline
paths:
  /api/v1/workspaces/{workspace_name}/pipeline-tags:
    get:
      description: 'List distinct tag strings attached to pipelines in this workspace.


        Returns tag names currently in use, suitable for autocomplete when adding tags.

        Use the ``name`` query parameter for case-insensitive substring search.

        Use ``order`` to control alphabetical sort direction (default ascending).


        To filter the pipelines list by tag, use ``GET .../pipelines`` with repeated

        ``tags`` query parameters; matching is case-insensitive and uses OR semantics.'
      operationId: list_pipeline_tags_api_v1_workspaces__workspace_name__pipeline_tags_get
      parameters:
      - description: Type the name of the workspace.
        in: path
        name: workspace_name
        required: true
        schema:
          description: Type the name of the workspace.
          title: Workspace Name
          type: string
      - description: Case-insensitive substring filter on tag names. Use for autocomplete when selecting tags.
        in: query
        name: name
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Case-insensitive substring filter on tag names. Use for autocomplete when selecting tags.
          title: Name
      - description: Sort distinct tag names alphabetically in ascending or descending order.
        in: query
        name: order
        required: false
        schema:
          default: ASC
          description: Sort distinct tag names alphabetically in ascending or descending order.
          enum:
          - ASC
          - DESC
          title: Order
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  type: string
                title: Response List Pipeline Tags Api V1 Workspaces  Workspace Name  Pipeline Tags Get
                type: array
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - HTTPBearer: []
      summary: List Pipeline Tags
      tags:
      - Pipeline
      x-deepset-permissions:
        action: read
        asset: pipelines
        asset_description: Access to individual pipeline details
        type: workspace
  /api/v1/workspaces/{workspace_name}/pipeline/versions:
    get:
      description: 'Lists query pipeline versions across all pipelines in the selected workspace. Supports OData filtering, pagination, and sorting. Allowed filter fields: is_draft and pipeline/name. Alias supported: pipeline_name maps to pipeline/name. Default sorting is version_number DESC. Pagination supports limit, before, after, and page_number. before/after cannot be used together, and before/after cannot be combined with page_number. Examples: GET /workspaces/default/pipeline/versions, GET /workspaces/default/pipeline/versions?filter=is_draft%20eq%20true, GET /workspaces/default/pipeline/versions?filter=pipeline/name%20eq%20''my-pipeline'', GET /workspaces/default/pipeline/versions?filter=pipeline_name%20eq%20''my-pipeline'', GET /workspaces/default/pipeline/versions?field=version_number&order=DESC&limit=20&page_number=1.'
      operationId: list_all_query_pipeline_versions_api_v1_workspaces__workspace_name__pipeline_versions_get
      parameters:
      - description: Type the name of the workspace.
        in: path
        name: workspace_name
        required: true
        schema:
          description: Type the name of the workspace.
          title: Workspace Name
          type: string
      - description: 'The OData filter you want to use to in your query. It supports exact match and `AND` operations. For example, to filter for a metadata `category:news` and `published_date` greater than or equal to January 1 2025, here''s what the URL could look like: ''url = "https://api.cloud.deepset.ai/api/v1/workspaces/production/files?limit=10&filter=category eq ''news'' and published_date ge ''2025-01-01'' "''. OData filters only work with cursor-based pagination (leave the `page_number` field blank to enable it).To learn more about the OData filter syntax, see: [Querying Data](https://www.odata.org/getting-started/basic-tutorial/#queryData).'
        in: query
        name: filter
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: 'The OData filter you want to use to in your query. It supports exact match and `AND` operations. For example, to filter for a metadata `category:news` and `published_date` greater than or equal to January 1 2025, here''s what the URL could look like: ''url = "https://api.cloud.deepset.ai/api/v1/workspaces/production/files?limit=10&filter=category eq ''news'' and published_date ge ''2025-01-01'' "''. OData filters only work with cursor-based pagination (leave the `page_number` field blank to enable it).To learn more about the OData filter syntax, see: [Querying Data](https://www.odata.org/getting-started/basic-tutorial/#queryData).'
          title: Filter
      - description: The number of entries to display. Leaving this field empty keeps the default, and max 10 results are returned.
        in: query
        name: limit
        required: false
        schema:
          default: 10
          description: The number of entries to display. Leaving this field empty keeps the default, and max 10 results are returned.
          maximum: 100
          title: Limit
          type: integer
      - description: Enter an ID if you want to see all entries before this ID. To use this option, clear the `page_number` parameter first.
        in: query
        name: before
        required: false
        schema:
          anyOf:
          - format: uuid
            type: string
          - type: 'null'
          description: Enter an ID if you want to see all entries before this ID. To use this option, clear the `page_number` parameter first.
          title: Before
      - description: Enter an ID if you want to see all entries after this ID. To use this option, clear the `page_number` parameter first.
        in: query
        name: after
        required: false
        schema:
          anyOf:
          - format: uuid
            type: string
          - type: 'null'
          description: Enter an ID if you want to see all entries after this ID. To use this option, clear the `page_number` parameter first.
          title: After
      - description: The number of the page you want to see.
        in: query
        name: page_number
        required: false
        schema:
          anyOf:
          - minimum: 1
            type: integer
          - type: 'null'
          description: The number of the page you want to see.
          title: Page Number
      - description: The name of the entity you want to sort by.<br/><br/>Supported values:<ul><li>`created_at`</li><li>`created_by/family_name`</li><li>`created_by/given_name`</li><li>`created_by/user_id`</li><li>`version_number`</li></ul>
        in: query
        name: field
        required: false
        schema:
          default: version_number
          description: The name of the entity you want to sort by.<br/><br/>Supported values:<ul><li>`created_at`</li><li>`created_by/family_name`</li><li>`created_by/given_name`</li><li>`created_by/user_id`</li><li>`version_number`</li></ul>
          enum:
          - created_at
          - version_number
          - created_by/user_id
          - created_by/given_name
          - created_by/family_name
          title: Field
          type: string
      - description: Choose how you want to sort the results.
        in: query
        name: order
        required: false
        schema:
          default: DESC
          description: Choose how you want to sort the results.
          enum:
          - ASC
          - DESC
          title: Order
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedResult_QueryPipelineVersion_'
          description: Successful Response
        '400':
          description: Invalid pagination parameters. before and after cannot be used together, and before/after cannot be used with page_number.
        '403':
          description: The user is not authorized to read pipeline versions in this workspace.
        '404':
          description: The requested workspace was not found.
        '422':
          description: Invalid filter expression.
      security:
      - HTTPBearer: []
      summary: List all query pipeline versions in a workspace
      tags:
      - Pipeline
      x-deepset-permissions:
        action: read
        asset: pipelines
        asset_description: Access to individual pipeline details
        type: workspace
  /api/v1/workspaces/{workspace_name}/pipeline_validations:
    post:
      description: Validates a pipeline YAML. Use this endpoint to validate your pipeline configuration before saving it.
      operationId: validate_pipeline_api_v1_workspaces__workspace_name__pipeline_validations_post
      parameters:
      - description: Type the name of the workspace.
        in: path
        name: workspace_name
        required: true
        schema:
          description: Type the name of the workspace.
          title: Workspace Name
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ValidatePipelineYaml'
        required: true
      responses:
        '204':
          description: Your pipeline is valid.
        '400':
          description: Check the pipeline configuration and make sure the components and parameters are correct. Additionally, make sure third-party models are accessible. You can connect Haystack Enterprise Platform to model providers using Connections or by passing the provider's API key.
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
        '503':
          description: The Haystack Runtime timed out while validating the pipeline. Try again in a few moments.
      security:
      - HTTPBearer: []
      summary: Validate Pipeline
      tags:
      - Pipeline
      x-deepset-permissions:
        action: read
        asset: pipelines
        asset_description: Access to individual pipeline details
        type: workspace
  /api/v1/workspaces/{workspace_name}/pipelines:
    get:
      description: 'Lists all the pipelines in the workspace.


        Filter by tag: ``?tags=production`` or ``?tags=a&tags=b`` — returns pipelines with any listed tag,

        case-insensitive.'
      operationId: list_pipelines_api_v1_workspaces__workspace_name__pipelines_get
      parameters:
      - description: Type the name of the workspace.
        in: path
        name: workspace_name
        required: true
        schema:
          description: Type the name of the workspace.
          title: Workspace Name
          type: string
      - description: The name of the pipeline you want to list.
        in: query
        name: pipeline_name
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: The name of the pipeline you want to list.
          title: Pipeline Name
      - description: Returns deleted pipelines.
        in: query
        name: deleted
        required: false
        schema:
          default: false
          description: Returns deleted pipelines.
          title: Deleted
          type: boolean
      - description: The status of the pipelines you want to list.
        in: query
        name: status
        required: false
        schema:
          anyOf:
          - enum:
            - UNDEPLOYED
            - DEPLOYED
            - DEPLOYMENT_IN_PROGRESS
            - UNDEPLOYMENT_IN_PROGRESS
            - DEPLOYMENT_FAILED
            - IDLE
            - ACTIVATING
            type: string
          - type: 'null'
          description: The status of the pipelines you want to list.
          title: Status
      - description: The desired status of the pipelines you want to list.
        in: query
        name: desired_status
        required: false
        schema:
          anyOf:
          - enum:
            - UNDEPLOYED
            - DEPLOYED
            type: string
          - type: 'null'
          description: The desired status of the pipelines you want to list.
          title: Desired Status
      - description: The service level of the pipelines you want to list.
        in: query
        name: service_level
        required: false
        schema:
          anyOf:
          - $ref: '#/components/schemas/PipelineServiceLevelWithDraftEnum'
          - type: 'null'
          description: The service level of the pipelines you want to list.
          title: Service Level
      - description: Returns pipelines that support prompts.
        in: query
        name: supports_prompt
        required: false
        schema:
          anyOf:
          - type: boolean
          - type: 'null'
          description: Returns pipelines that support prompts.
          title: Supports Prompt
      - description: The ID of the index you want to use for filtering.
        in: query
        name: pipeline_index_id
        required: false
        schema:
          anyOf:
          - format: uuid
            type: string
          - type: 'null'
          description: The ID of the index you want to use for filtering.
          title: Pipeline Index Id
      - description: Filter pipelines that have any of the listed tags. Repeat the parameter for multiple values, e.g. ?tags=production&tags=support. Matching is case-insensitive.
        in: query
        name: tags
        required: false
        schema:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          description: Filter pipelines that have any of the listed tags. Repeat the parameter for multiple values, e.g. ?tags=production&tags=support. Matching is case-insensitive.
          title: Tags
      - description: The number of entries to display. Leaving this field empty keeps the default, and max 10 results are returned.
        in: query
        name: limit
        required: false
        schema:
          default: 10
          description: The number of entries to display. Leaving this field empty keeps the default, and max 10 results are returned.
          maximum: 100
          title: Limit
          type: integer
      - description: Enter an ID if you want to see all entries before this ID. To use this option, clear the `page_number` parameter first.
        in: query
        name: before
        required: false
        schema:
          anyOf:
          - format: uuid
            type: string
          - type: 'null'
          description: Enter an ID if you want to see all entries before this ID. To use this option, clear the `page_number` parameter first.
          title: Before
      - description: Enter an ID if you want to see all entries after this ID. To use this option, clear the `page_number` parameter first.
        in: query
        name: after
        required: false
        schema:
          anyOf:
          - format: uuid
            type: string
          - type: 'null'
          description: Enter an ID if you want to see all entries after this ID. To use this option, clear the `page_number` parameter first.
          title: After
      - description: The number of the page you want to see.
        in: query
        name: page_number
        required: false
        schema:
          anyOf:
          - minimum: 1
            type: integer
          - type: 'null'
          description: The number of the page you want to see.
          title: Page Number
      - description: The name of the entity you want to sort by.<br/><br/>Supported values:<ul><li>`created_at`</li><li>`created_by/family_name`</li><li>`created_by/given_name`</li><li>`created_by/user_id`</li><li>`desired_status`</li><li>`desired_status,updated_at`</li><li>`name`</li><li>`service_level`</li><li>`service_level,created_at`</li><li>`service_level,updated_at`</li><li>`updated_at`</li></ul>
        in: query
        name: field
        required: false
        schema:
          default: service_level,updated_at
          description: The name of the entity you want to sort by.<br/><br/>Supported values:<ul><li>`created_at`</li><li>`created_by/family_name`</li><li>`created_by/given_name`</li><li>`created_by/user_id`</li><li>`desired_status`</li><li>`desired_status,updated_at`</li><li>`name`</li><li>`service_level`</li><li>`service_level,created_at`</li><li>`service_level,updated_at`</li><li>`updated_at`</li></ul>
          enum:
          - created_at
          - name
          - service_level
          - created_by/user_id
          - created_by/given_name
          - created_by/family_name
          - service_level,created_at
          - updated_at
          - service_level,updated_at
          - desired_status
          - desired_status,updated_at
          title: Field
          type: string
      - description: Choose how you want to sort the results.
        in: query
        name: order
        required: false
        schema:
          default: DESC
          description: Choose how you want to sort the results.
          enum:
          - ASC
          - DESC
          title: Order
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedResult_Pipeline_'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - HTTPBearer: []
      summary: List Pipelines
      tags:
      - Pipeline
      x-deepset-permissions:
        action: read
        asset: pipelines
        asset_description: Access to individual pipeline details
        type: workspace
    post:
      description: Creates a pipeline YAML file.
      operationId: create_pipeline_api_v1_workspaces__workspace_name__pipelines_post
      parameters:
      - description: Type the name of the workspace.
        in: path
        name: workspace_name
        required: true
        schema:
          description: Type the name of the workspace.
          title: Workspace Name
          type: string
      - description: Validates the pipeline without actually storing it.
        in: query
        name: dry_run
        required: false
        schema:
          anyOf:
          - type: boolean
          - type: 'null'
          default: false
          description: Validates the pipeline without actually storing it.
          title: Dry Run
      requestBody:
        content:
          application/json:
            schema:
              $defs:
                DeepsetCloudVersion:
                  enum:
                  - v2
                  title: DeepsetCloudVersion
                  type: string
              $ref: '#/components/schemas/CreatePipeline'
              properties:
                deepset_cloud_version:
                  $ref: '#/components/schemas/DeepsetCloudVersion'
                  default: v2
                  description: The version of deepset the pipeline was created with.
                  title: deepset Version
                indexing_yaml:
                  anyOf:
                  - type: string
                  - type: 'null'
                  description: The deepset pipeline YAML configuration for indexing.
                  title: Indexing YAML
                name:
                  description: Name of the pipeline.
                  title: Pipeline Name
                  type: string
                query_yaml:
                  anyOf:
                  - type: string
                  - type: 'null'
                  description: The deepset pipeline YAML configuration for querying.
                  title: Query YAML
              required:
              - name
              title: CreatePipeline
              type: object
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PipelineName'
          description: Your pipeline was created.
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PipelineName'
          description: Successful Response
        '402':
          description: You've reached the maximum number of pipelines for your organization.
        '409':
          description: A pipeline with this name is already in your workspace. You can't create pipelines with the same names. Give your pipeline a unique name and save it.
        '422':
          description: Invalid request body or pipeline configuration.
        '424':
          description: We couldn't find the model used in this pipeline so the pipeline wasn't created. Make sure you use an existing model.
      security:
      - HTTPBearer: []
      summary: Create Pipeline
      tags:
      - Pipeline
      x-deepset-permissions:
        action: write
        asset: pipelines
        asset_description: Access to individual pipeline details
        type: workspace
  /api/v1/workspaces/{workspace_name}/pipelines/apply-migrations:
    post:
      description: 'Apply detected migrations to a pipeline asynchronously.


        Creates a migration job and dispatches it to a background worker.

        Poll the migrations endpoint to track progress.'
      operationId: apply_pipeline_migrations_api_v1_workspaces__workspace_name__pipelines_apply_migrations_post
      parameters:
      - description: Type the name of the workspace.
        in: path
        name: workspace_name
        required: true
        schema:
          description: Type the name of the workspace.
          title: Workspace Name
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MigrationRequest'
        required: true
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MigrationJobStatusResponse'
          description: Migration job accepted and queued for processing.
        '409':
          description: A migration is already in progress for this pipeline.
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - HTTPBearer: []
      summary: Apply Pipeline Migrations
      tags:
      - Pipeline
      x-deepset-permissions:
        action: write
        asset: pipelines
        asset_description: Access to individual pipeline details
        type: workspace
  /api/v1/workspaces/{workspace_name}/pipelines/detect-migrations:
    post:
      description: 'Detect possible migrations in a pipeline.


        Call this endpoint after a successful validation to check if the pipeline

        contains components that can be removed/migrated.'
      operationId: detect_pipeline_migrations_api_v1_workspaces__workspace_name__pipelines_detect_migrations_post
      parameters:
      - description: Type the name of the workspace.
        in: path
        name: workspace_name
        required: true
        schema:
          description: Type the name of the workspace.
          title: Workspace Name
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MigrationRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MigrationDetectionResult'
          description: Detected pipeline migrations.
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - HTTPBearer: []
      summary: Detect Pipeline Migrations
      tags:
      - Pipeline
      x-deepset-permissions:
        action: read
        asset: pipelines
        asset_description: Access to individual pipeline details
        type: workspace
  /api/v1/workspaces/{workspace_name}/pipelines/{pipeline_name}:
    delete:
      description: Removes a pipeline from deepset within the specified workspace.
      operationId: delete_pipeline_api_v1_workspaces__workspace_name__pipelines__pipeline_name__delete
      parameters:
      - description: The name of the pipeline you want to delete.
        in: path
        name: pipeline_name
        required: true
        schema:
          description: The name of the pipeline you want to delete.
          title: Pipeline Name
          type: string
      - description: Type the name of the workspace.
        in: path
        name: workspace_name
        required: true
        schema:
          description: Type the name of the workspace.
          title: Workspace Name
          type: string
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: The pipeline was successfully deleted.
        '404':
          description: The pipeline wasn't found.
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - HTTPBearer: []
      summary: Delete Pipeline
      tags:
      - Pipeline
      x-deepset-permissions:
        action: write
        asset: pipelines
        asset_description: Access to individual pipeline details
        type: workspace
    get:
      description: Returns a pipeline.
      operationId: get_pipeline_api_v1_workspaces__workspace_name__pipelines__pipeline_name__get
      parameters:
      - description: The name of the pipeline you want to fetch.
        in: path
        name: pipeline_name
        required: true
        schema:
          description: The name of the pipeline you want to fetch.
          title: Pipeline Name
          type: string
      - description: Type the name of the workspace.
        in: path
        name: workspace_name
        required: true
        schema:
          description: Type the name of the workspace.
          title: Workspace Name
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pipeline'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - HTTPBearer: []
      summary: Get Pipeline
      tags:
      - Pipeline
      x-deepset-permissions:
        action: read
        asset: pipelines
        asset_description: Access to individual pipeline details
        type: workspace
    patch:
      description: 'Updates the pipeline name, service level (development or production), or status.


        Search users have permission to change pipeline status only.'
      operationId: update_pipeline_api_v1_workspaces__workspace_name__pipelines__pipeline_name__patch
      parameters:
      - description: Name of the pipeline.
        in: path
        name: pipeline_name
        required: true
        schema:
          description: Name of the pipeline.
          title: Pipeline Name
          type: string
      - description: Type the name of the workspace.
        in: path
        name: workspace_name
        required: true
        schema:
          description: Type the name of the workspace.
          title: Workspace Name
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PipelineUpdateRequest'
        required: true
      responses:
        '204':
          description: The pipeline was successfully renamed.
        '400':
          description: The pipeline name is invalid. Make sure the name only contains valid characters.
        '403':
          description: You don't have permission to update this pipeline.
        '404':
          description: We couldn't find the pipeline you specified. Make sure the name is correct and the pipeline exists in the workspace you specified.
        '409':
          description: Pipeline with the same name already exists, you're trying to activate an undeployed pipeline or you're trying to change the pipeline service level of an undeployed pipeline.
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
        '424':
          description: We could not activate the pipeline because the linked index was not found. Please check if the index exists and is linked to the pipeline.
      security:
      - HTTPBearer: []
      summary: Update Pipeline
      tags:
      - Pipeline
      x-deepset-permissions:
        action: write
        asset: pipelines
        asset_description: Access to individual pipeline details
        type: workspace
  /api/v1/workspaces/{workspace_name}/pipelines/{pipeline_name}/activate:
    post:
      description: Activates the pipeline.
