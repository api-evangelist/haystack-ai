name: Haystack / deepset
kind: company
description: Haystack is deepset's open-source Python framework for building context-engineered, production-ready
  LLM applications - modular Pipelines and agent workflows assembled from 100+ Components and document
  stores for RAG, semantic search, and agents. Haystack pipelines deploy as REST services via Hayhooks,
  and the commercial deepset AI Platform (deepset Cloud) exposes a hosted REST API at api.cloud.deepset.ai
  for pipelines, search, files, and workspaces.
