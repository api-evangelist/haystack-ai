aid: haystack-ai
name: Haystack / deepset
review:
  question: Does Haystack / deepset expose a documented public WebSocket or streaming (SSE) API?
  answer: false
  date: '2026-06-20'
  reviewer: API Evangelist
  asyncapiSpecCreated: false
  asyncapiScopeNote: |
    No AsyncAPI document was created. The hosted deepset Cloud REST API
    (api.cloud.deepset.ai) exposes only standard request/response HTTPS
    endpoints under /api/v1; its search endpoint returns a single JSON
    response rather than a Server-Sent Events stream. The open-source
    Haystack framework is a Python library, and pipelines deployed via
    Hayhooks expose generated HTTP REST (and optional MCP) endpoints, not a
    fixed, documented public WebSocket or SSE surface. With no documented
    streaming or bidirectional transport in scope, no AsyncAPI was authored.
findings:
  summary: |
    Haystack itself is an open-source Apache-2.0 Python framework, not a
    hosted API; it is consumed as a library. Haystack pipelines can be served
    as self-hosted REST APIs (and MCP servers) via Hayhooks, but that surface
    is generated per pipeline and self-hosted, not a public deepset endpoint.
    The commercial deepset AI Platform (deepset Cloud) does expose a hosted
    REST API at https://api.cloud.deepset.ai (EU) and https://api.us.deepset.ai
    (US), with all resource paths under /api/v1 and Bearer API-key auth. The
    documented surface covers workspaces, pipelines (create/list/deploy/
    undeploy), search/query against deployed pipelines, and files (upload/list/
    delete/meta plus chunked upload sessions). No documented public WebSocket
    (ws:// or wss://) or SSE streaming endpoint was found.
  transports:
    - protocol: Library/SDK
      scheme: python
      baseURL: https://github.com/deepset-ai/haystack
      documented: true
      note: Open-source Haystack framework consumed as a Python library, not a hosted API.
    - protocol: REST
      scheme: https
      baseURL: https://api.cloud.deepset.ai/api/v1
      documented: true
      note: Hosted deepset Cloud REST API; EU host above, US host https://api.us.deepset.ai/api/v1.
    - protocol: REST
      scheme: http
      documented: true
      note: Self-hosted per-pipeline REST/MCP endpoints generated by Hayhooks; surface varies by pipeline.
    - protocol: WebSocket
      scheme: wss
      documented: false
      note: No WebSocket endpoint is documented for Haystack, Hayhooks, or the deepset Cloud API as of the review date.
    - protocol: SSE
      scheme: https
      documented: false
      note: The deepset Cloud search endpoint returns a single JSON response; no Server-Sent Events streaming surface is documented.
  endpointsConfirmedRest:
    - GET    https://api.cloud.deepset.ai/api/v1/workspaces
    - POST   https://api.cloud.deepset.ai/api/v1/workspaces
    - GET    https://api.cloud.deepset.ai/api/v1/workspaces/{workspace_name}
    - DELETE https://api.cloud.deepset.ai/api/v1/workspaces/{workspace_name}
    - GET    https://api.cloud.deepset.ai/api/v1/workspaces/{workspace_name}/pipelines
    - POST   https://api.cloud.deepset.ai/api/v1/workspaces/{workspace_name}/pipelines
    - GET    https://api.cloud.deepset.ai/api/v1/workspaces/{workspace_name}/pipelines/{pipeline_name}
    - DELETE https://api.cloud.deepset.ai/api/v1/workspaces/{workspace_name}/pipelines/{pipeline_name}
    - POST   https://api.cloud.deepset.ai/api/v1/workspaces/{workspace_name}/pipelines/{pipeline_name}/deploy
    - POST   https://api.cloud.deepset.ai/api/v1/workspaces/{workspace_name}/pipelines/{pipeline_name}/undeploy
    - POST   https://api.cloud.deepset.ai/api/v1/workspaces/{workspace_name}/pipelines/{pipeline_name}/search
    - GET    https://api.cloud.deepset.ai/api/v1/workspaces/{workspace_name}/files
    - POST   https://api.cloud.deepset.ai/api/v1/workspaces/{workspace_name}/files
    - DELETE https://api.cloud.deepset.ai/api/v1/workspaces/{workspace_name}/files/{file_id}
    - PATCH  https://api.cloud.deepset.ai/api/v1/workspaces/{workspace_name}/files/{file_id}/meta
    - POST   https://api.cloud.deepset.ai/api/v1/workspaces/{workspace_name}/upload_sessions
    - GET    https://api.cloud.deepset.ai/api/v1/workspaces/{workspace_name}/upload_sessions/{session_id}
    - PUT    https://api.cloud.deepset.ai/api/v1/workspaces/{workspace_name}/upload_sessions/{session_id}
sources:
  - url: https://docs.haystack.deepset.ai/docs/intro
    type: Documentation
    note: Open-source Haystack framework overview; Apache-2.0 Python library, Pipelines and Components.
  - url: https://github.com/deepset-ai/haystack
    type: GitHub
    note: Source repo confirming open-source orchestration framework for LLM applications.
  - url: https://github.com/deepset-ai/hayhooks
    type: GitHub
    note: Hayhooks deploys Haystack pipelines as self-hosted REST APIs / MCP servers.
  - url: https://docs.cloud.deepset.ai/reference/api-overview
    type: APIReference
    note: Base URLs, /api/v1 prefix, Bearer API-key auth, pagination, request timeouts.
  - url: https://docs.cloud.deepset.ai/docs/run-a-search
    type: Documentation
    note: POST .../pipelines/{pipeline}/search with queries, filters, params; single JSON response.
  - url: https://docs.cloud.deepset.ai/docs/upload-files
    type: Documentation
    note: Files upload/list/meta and upload_sessions endpoints.
actions:
  asyncapiPath: null
  apisYmlUpdated: true
  reason: |
    No documented WebSocket or SSE streaming surface exists for the
    open-source framework, Hayhooks, or the hosted deepset Cloud REST API, so
    no AsyncAPI document was authored. An OpenAPI 3.0.1 specification was
    created for the documented deepset Cloud REST endpoints, and apis.yml
    captures both the open-source framework (as a Library/SDK surface) and the
    hosted REST API sub-APIs.
